<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body,#map{height:100%;margin:0}.info{position:absolute;z-index:1000;left:10px;top:10px;background:#fff;padding:8px 10px;border-radius:8px;font:13px system-ui}</style>
</head><body><div id="map"></div><div class="info" id="info">Cargando…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(async()=>{const map=L.map('map',{preferCanvas:true,scrollWheelZoom:false}).setView([40,-3],4);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const m=await fetch('./manifest.json',{cache:'no-store'}).then(r=>r.json());
const b=m.bounds,bounds=[[b.south,b.west],[b.north,b.east]];
L.imageOverlay('./'+m.image,bounds,{opacity:.70}).addTo(map);map.fitBounds(bounds);
document.getElementById('info').textContent=`${m.model} · ${m.variable} · +${m.forecast_step_hours} h · ${m.data_provider}`;
})().catch(e=>document.getElementById('info').textContent='Mapa no disponible: '+e.message);
</script></body></html>
