name: Análisis oficial · Smoke test ECMWF GFS ICON-EU

on:
  workflow_dispatch:
  push:
    branches:
      - vnext-mapas-profesional
    paths:
      - 'scripts/vnext_analysis_official_smoke.py'
      - '.github/workflows/vnext-analysis-official-smoke.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: analysis-official-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Validar números oficiales directos · 3 modelos
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout backend vNext
        uses: actions/checkout@v4
        with:
          ref: vnext-mapas-profesional

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar prueba
        run: python -m py_compile scripts/vnext_analysis_official_smoke.py

      - name: Extraer valores oficiales directos
        timeout-minutes: 165
        run: python scripts/vnext_analysis_official_smoke.py

      - name: Validar contrato
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('vnext-analysis-official-smoke/analysis-official-smoke.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['status']=='ok', d
          assert d['checks']['no_open_meteo'] is True, d
          assert set(d['models'])=={'ecmwf','gfs','icon_eu'}, d['models'].keys()
          for model in d['models'].values():
              assert len(model['steps'])==2
              for step in model['steps'].values():
                  assert len(step['points'])==3
                  for point in step['points'].values():
                      for key in ('temperature_2m','mslp','temperature_850hpa','geopotential_height_500hpa','wind_250hpa'):
                          assert key in point, (key, point)
          print('ANÁLISIS OFICIAL SMOKE OK · 3 modelos · f000/f024 · 3 puntos · sin Open-Meteo')
          PY

      - name: Subir prueba trazable
        uses: actions/upload-artifact@v4
        with:
          name: analisis-oficial-smoke
          path: vnext-analysis-official-smoke/analysis-official-smoke.json
          retention-days: 7
