name: Fase 65A · GitHub Pages multicalidad

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Publicar ECMWF, GFS e ICON-EU en GitHub Pages · horizonte completo + precipitación"
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-quality-phase65.yml"
      - "scripts/pages_quality_phase65.py"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-quality-phase65
  cancel-in-progress: true

jobs:
  quality-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install "Pillow>=10.0"

      - name: Localizar publicación base verde exacta
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "${EVENT_RUN_ID:-}" ]; then
            run_id="$EVENT_RUN_ID"
          else
            api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-ecmwf-pages.yml/runs?status=success&per_page=20"
            run_id=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" | python -c "import json,sys; d=json.load(sys.stdin); runs=[r for r in d.get('workflow_runs',[]) if r.get('conclusion')=='success']; print(runs[0]['id'] if runs else '')")
          fi
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Publicación base usada: $run_id"

      - name: Descargar artefacto exacto de GitHub Pages
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _pages_download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Extraer sitio base validado
        run: |
          set -euo pipefail
          mapfile -t TARFILES < <(find _pages_download -type f -name 'artifact.tar')
          if [ "${#TARFILES[@]}" -ne 1 ]; then
            echo "Se esperaba un único artifact.tar y hay ${#TARFILES[@]}" >&2
            exit 1
          fi
          mkdir -p _site
          tar -xf "${TARFILES[0]}" -C _site
          test -f _site/index.html
          test -f _site/icon-eu/latest.json
          test -f _site/ecmwf/manifest-phase29-ecmwf.json
          test -f _site/gfs/manifest-phase29-gfs.json

      - name: Registrar huella de los 2116 mapas originales
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('_site')
          files=sorted(
              p for model in ('ecmwf','gfs','icon-eu')
              for p in (root/model).rglob('*.webp')
          )
          if len(files)!=2116:
              raise SystemExit(f'Paquete base inesperado: {len(files)} WebP, esperado 2116')
          h=hashlib.sha256()
          for p in files:
              rel=p.relative_to(root).as_posix().encode('utf-8')
              h.update(rel+b'\0')
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):
                      h.update(chunk)
          digest=h.hexdigest()
          Path('_base-original.sha256').write_text(digest+'\n',encoding='ascii')
          print('Originales:',len(files),'SHA-256 paquete:',digest)
          PY

      - name: Generar Fase 65A · Ahorro, Equilibrada y Alta
        run: python scripts/pages_quality_phase65.py --root _site --workers 4

      - name: Validar Fase 65A y originales intactos
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('_site')
          files=sorted(
              p for model in ('ecmwf','gfs','icon-eu')
              for p in (root/model).rglob('*.webp')
          )
          h=hashlib.sha256()
          for p in files:
              rel=p.relative_to(root).as_posix().encode('utf-8')
              h.update(rel+b'\0')
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):
                      h.update(chunk)
          before=Path('_base-original.sha256').read_text(encoding='ascii').strip()
          after=h.hexdigest()
          if before!=after:
              raise SystemExit(f'Los mapas originales cambiaron: antes={before} después={after}')

          manifest=json.loads((root/'quality/manifest-phase65.json').read_text(encoding='utf-8'))
          if manifest.get('schema')!=65 or manifest.get('status')!='ok':
              raise SystemExit(f'Manifiesto F65 inválido: {manifest.get("schema")} / {manifest.get("status")}')
          if manifest.get('original_maps')!=2116:
              raise SystemExit(f'Originales F65 inválidos: {manifest.get("original_maps")}')
          if manifest.get('original_model_counts')!={'ecmwf':259,'gfs':277,'icon-eu':1580}:
              raise SystemExit(f'Conteo por modelo inválido: {manifest.get("original_model_counts")}')
          if manifest.get('variant_maps')!=3710:
              raise SystemExit(f'Variantes F65 incompletas: {manifest.get("variant_maps")}')
          expected={'economy':1850,'balanced':930,'high':930}
          for level,count in expected.items():
              got=manifest.get('levels',{}).get(level,{}).get('generated')
              if got!=count:
                  raise SystemExit(f'{level}: {got} variantes, esperado {count}')

          site_bytes=sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          max_bytes=950*1024*1024
          if site_bytes>max_bytes:
              raise SystemExit(f'Sitio demasiado grande para publicar con margen seguro: {site_bytes/1024/1024:.1f} MiB')
          print('Fase 65A validada')
          print('Originales intactos SHA-256:',after)
          print('Variantes:',manifest['variant_maps'])
          print('Tamaño variantes MiB:',round(manifest.get('variant_bytes',0)/1024/1024,1))
          print('Tamaño sitio MiB:',round(site_bytes/1024/1024,1))
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio multicalidad
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

      - name: Publicar Fase 65A
        id: deployment
        uses: actions/deploy-pages@v4
