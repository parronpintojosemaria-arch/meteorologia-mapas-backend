name: Fase 66H · 500 hPa premium + intervalos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/synoptic_500_premium_phase66h.py"
      - ".github/workflows/phase66h-500hpa-premium-cadence.yml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  ecmwf:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validar sintaxis 66H
        run: python -m py_compile scripts/synoptic_500_premium_phase66h.py
      - name: Generar ECMWF 500 hPa 0-24 h cada 3 h
        run: python scripts/synoptic_500_premium_phase66h.py ecmwf
      - name: Validar ECMWF visual + temporal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("experimental-phase66h/ecmwf/manifest-phase66h.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          expected=list(range(0,25,3))
          assert d["phase"]=="66H" and d["status"]=="ok", d
          assert d["generated_steps"]==expected, d["generated_steps"]
          assert d["summary"]=={"successes":9,"failures":0,"expected":9}, d["summary"]
          assert d["display_bounds"]=={"west":-45.0,"east":45.0,"south":20.0,"north":67.0}, d["display_bounds"]
          assert [x["value"] for x in d["viewer"]["intervals"]]==["auto","3","6","12","24"]
          assert [h for h in expected if h%6==0]==[0,6,12,18,24]
          for k,r in d["maps"].items():
              assert r["status"]=="ok", (k,r)
              s=r["size"]
              assert s["width"] > s["height"] and s["aspect_ratio"] > 1.05, (k,s)
              assert s["width"] >= 1000, (k,s)
              pr=r["mean_sea_level_pressure_range_hpa"]
              assert 850 <= pr["min"] <= 1100 and 850 <= pr["max"] <= 1100, (k,pr)
              assert (p.parent/r["image"]).is_file(), r["image"]
          html=(p.parent/"preview-phase66h.html").read_text(encoding="utf-8")
          for token in ('id="interval"',"Automático (3 h)","Ver dominio","scrollWheelZoom:false"):
              assert token in html, token
          print("ECMWF 66H validada 9/9 · apaisado · intervalos OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fase66h-ecmwf-500-premium
          path: experimental-phase66h/ecmwf
          retention-days: 7
          if-no-files-found: error

