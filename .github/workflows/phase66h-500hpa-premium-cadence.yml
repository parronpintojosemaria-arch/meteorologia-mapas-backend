          assert d["summary"]=={"successes":25,"failures":0,"expected":25}, d["summary"]
          assert d["display_bounds"]=={"west":-23.5,"east":45.0,"south":29.5,"north":67.0}, d["display_bounds"]
          assert [x["value"] for x in d["viewer"]["intervals"]]==["auto","1","3","6","12","24"]
          assert [h for h in expected if h%6==0]==[0,6,12,18,24]
