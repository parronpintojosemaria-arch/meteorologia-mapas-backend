name: Mapas IA · AIFS visual HD

on:
  workflow_dispatch:
  push:
    branches:
      - vnext-mapas-ai-models
    paths:
      - 'scripts/vnext_aifs_visual_smoke.py'
      - '.github/workflows/vnext-aifs-visual-smoke.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: vnext-aifs-visual-smoke
  cancel-in-progress: true

jobs:
  visual:
    name: Generar 18 mapas AIFS España/Europa
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          ref: vnext-mapas-ai-models

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar
        run: python -m py_compile scripts/vnext_aifs_visual_smoke.py

      - name: Renderizar muestras HD
        timeout-minutes: 135
        run: python scripts/vnext_aifs_visual_smoke.py

      - name: Validar manifiesto
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('vnext-aifs-visual-smoke/manifest.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['status']=='ok'
          assert d['expected_count']==18
          assert len(d['files'])==18
          assert {x['domain'] for x in d['files']}=={'spain','europe'}
          for x in d['files']:
              assert x['bytes']>512
              assert x['width'] in (2400,2800)
          print('AIFS VISUAL OK · 18 mapas HD')
          PY

      - name: Subir muestras
        uses: actions/upload-artifact@v4
        with:
          name: aifs-visual-smoke
          path: vnext-aifs-visual-smoke/
          retention-days: 7
