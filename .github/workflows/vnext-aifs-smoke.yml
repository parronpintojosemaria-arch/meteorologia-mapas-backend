name: vNext · AIFS Single v2 · prueba oficial

on:
  push:
    paths:
      - '.github/workflows/vnext-aifs-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verificar AIFS real +360 h y campos
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout rama
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar motor AIFS
        run: |
          python -m py_compile scripts/vnext_aifs_data.py
          python -m py_compile scripts/vnext_aifs_generate.py
          python -m py_compile scripts/vnext_aifs_assemble.py
          python -m py_compile scripts/vnext_ecmwf_render.py
          python -m py_compile scripts/vnext_current_guard.py

      - name: Seleccionar ciclo AIFS completo +360 h
        run: python scripts/vnext_aifs_generate.py prepare

      - name: Verificar identidad AIFS v2 y campos reales
        run: |
          python - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          from eccodes import codes_grib_new_from_file, codes_get, codes_release
          sys.path.insert(0,'scripts')
          import vnext_aifs_data as d

          prep=json.loads(Path('vnext-full-out/aifs/prep.json').read_text())
          run=datetime.strptime(prep['cycle'],'%Y%m%dT%HZ').replace(tzinfo=timezone.utc)

          identity=d.RAW_ROOT/'identity.grib2'
          d.retrieve('prepare',run,12,'sfc',['2t'],identity,attempts=1)
          with identity.open('rb') as fh:
              gid=codes_grib_new_from_file(fh)
              pid=int(codes_get(gid,'generatingProcessIdentifier'))
              codes_release(gid)
          identity.unlink(missing_ok=True)
          assert pid==5, f'NO ES AIFS Single v2: generatingProcessIdentifier={pid}'
          print('IDENTIDAD AIFS SINGLE V2 OK · generatingProcessIdentifier=5')

          s,source,errs=d.surface_fields(run,12)
          assert set(s)=={'2t','10u','10v','tcc','msl','tp','sf','cp'}, set(s)
          for key,(arr,units,bounds) in s.items():
              assert arr.ndim==2 and arr.size>1000
              assert bounds['west']<=-39.8 and bounds['east']>=59.8
              assert bounds['south']<=22.2 and bounds['north']>=75.8
              print('SURFACE',key,arr.shape,units,bounds)

          lo,src,_=d.pressure_fields(run,12,[925,850,700,500],'lower')
          up,src2,_=d.pressure_fields(run,12,[300,250,200],'upper')
          assert set(lo)=={925,850,700,500}
          assert set(up)=={300,250,200}
          for lev,fields in {**lo,**up}.items():
              assert set(fields)=={'t','z','u','v'}
              print('PRESSURE',lev,'OK')

          print('AIFS SMOKE COMPLETO OK · ciclo',prep['cycle'],'· surface',source,'· lower',src,'· upper',src2)
          PY
