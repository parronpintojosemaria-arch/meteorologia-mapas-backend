name: Mapas IA · ECMWF AIFS Single smoke

on:
  workflow_dispatch:
  push:
    branches:
      - vnext-mapas-ai-models
    paths:
      - 'scripts/vnext_aifs_smoke.py'
      - '.github/workflows/vnext-aifs-smoke.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: vnext-aifs-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Validar AIFS superficie + niveles +360 h
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          ref: vnext-mapas-ai-models

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar
        run: python -m py_compile scripts/vnext_aifs_smoke.py

      - name: Probar AIFS oficial
        timeout-minutes: 135
        run: python scripts/vnext_aifs_smoke.py

      - name: Validar contrato
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('vnext-aifs-smoke/aifs-smoke.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['status']=='ok'
          assert d['checks']['official_open_data'] is True
          assert d['checks']['model']=='aifs-single'
          assert d['checks']['steps_verified']==[0,24,360]
          assert d['checks']['pressure_levels_verified_hpa']==[850,500,250]
          for step in ('f000','f024','f360'):
              assert step in d['steps']
              assert '2t' in d['steps'][step]['surface']
              assert '500' in d['steps'][step]['pressure']
          print('AIFS SMOKE OK · superficie + 850/500/250 · +360 h')
          PY

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: aifs-smoke
          path: vnext-aifs-smoke/aifs-smoke.json
          retention-days: 7
