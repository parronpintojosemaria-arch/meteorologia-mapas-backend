name: Diagnóstico Fase 38 · ICON-EU precipitación

on:
  push:
    paths:
      - 'scripts/icon_eu_precip_diag_phase38.py'
      - '.github/workflows/icon-eu-precip-diag-phase38.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precip-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Medir diferencia TOT_PREC vs lluvia+nieve
        run: python scripts/icon_eu_precip_diag_phase38.py

      - name: Subir diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-icon-eu-precipitacion-fase38
          path: public-icon38-diag/icon-eu/
          if-no-files-found: error
          retention-days: 7
