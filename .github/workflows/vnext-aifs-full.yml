name: vNext · AIFS completo HD · 2.192 mapas · sin publicar

on:
  workflow_dispatch:
  push:
    branches:
      - vnext-mapas-ai-models
    paths:
      - 'scripts/vnext_aifs_data.py'
      - 'scripts/vnext_aifs_generate.py'
      - 'scripts/vnext_aifs_assemble.py'
      - 'scripts/vnext_ecmwf_render.py'
      - 'scripts/vnext_current_guard.py'
      - 'vnext/config/domains.json'
      - '.github/workflows/vnext-aifs-full.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: vnext-aifs-full-no-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Seleccionar pasada AIFS completa +360 h
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      cycle: ${{ steps.cycle.outputs.cycle }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vnext-mapas-ai-models
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compilar AIFS
        run: |
          python -m py_compile scripts/vnext_aifs_data.py
          python -m py_compile scripts/vnext_aifs_generate.py
          python -m py_compile scripts/vnext_aifs_assemble.py
          python -m py_compile scripts/vnext_current_guard.py
      - name: Elegir ciclo común completo
        run: python scripts/vnext_aifs_generate.py prepare
      - id: cycle
        name: Exportar ciclo
        shell: bash
        run: |
          CYCLE=$(python -c "import json;print(json.load(open('vnext-full-out/aifs/prep.json'))['cycle'])")
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"
          echo "AIFS ciclo seleccionado: $CYCLE"
      - uses: actions/upload-artifact@v4
        with:
          name: vnext-aifs-full-prep
          path: vnext-full-out/aifs/prep.json
          retention-days: 3

  generate:
    name: Generar AIFS ${{ matrix.group }} · España 2400 · Europa 2800
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [surface, lower, upper]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vnext-mapas-ai-models
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generar grupo completo
        run: python scripts/vnext_aifs_generate.py "${{ matrix.group }}" --cycle "${{ needs.prepare.outputs.cycle }}"
      - name: Guard de grupo
        env:
          GROUP: ${{ matrix.group }}
          CYCLE: ${{ needs.prepare.outputs.cycle }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from PIL import Image
          expected={'surface':728,'lower':732,'upper':732}
          group=os.environ['GROUP']; cycle=os.environ['CYCLE']
          root=Path('vnext-full-out/aifs/cycles')/cycle
          f=root/f'fragment-{group}.json'
          m=json.loads(f.read_text(encoding='utf-8'))
          assert m['status']=='ready' and m['production_changed'] is False
          assert m['expected_count']==expected[group] and len(m['files'])==expected[group]
          widths={'spain':2400,'europe':2800}
          for row in m['files']:
              p=root/row['path']
              assert p.is_file() and p.stat().st_size>100
              assert row['width']==widths[row['domain']] and row['height']>900
          for row in (m['files'][0],m['files'][len(m['files'])//2],m['files'][-1]):
              with Image.open(root/row['path']) as im: im.verify()
          print('AIFS GROUP OK',group,len(m['files']))
          PY
      - name: Subir grupo HD temporal
        uses: actions/upload-artifact@v4
        with:
          name: vnext-aifs-full-${{ matrix.group }}
          path: vnext-full-out/aifs/cycles/${{ needs.prepare.outputs.cycle }}
          retention-days: 3
          compression-level: 1

  assemble:
    name: Ensamblar · validar 2.192 · medir espacio
    needs: [prepare, generate]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vnext-mapas-ai-models
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pillow
        run: python -m pip install --upgrade pillow
      - name: Descargar los tres grupos
        uses: actions/download-artifact@v4
        with:
          pattern: vnext-aifs-full-*
          path: vnext-full-merged/aifs
          merge-multiple: true
      - name: Eliminar prep si quedó mezclado
        run: rm -f vnext-full-merged/aifs/prep.json
      - name: Validación completa y presupuesto real
        run: python scripts/vnext_aifs_assemble.py
      - name: Construir current.json candidato
        env:
          CYCLE: ${{ needs.prepare.outputs.cycle }}
        run: |
          python scripts/vnext_current_guard.py             --model aifs             --cycle "$CYCLE"             --cycle-dir vnext-full-merged/aifs             --base-url 'https://parronpintojosemaria-arch.github.io/meteorologia-mapas-aifs'             --output vnext-full-summary/aifs/current-candidate.json
      - name: Guard final sin producción
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('vnext-full-summary/aifs/report.json').read_text())
          c=json.loads(Path('vnext-full-summary/aifs/current-candidate.json').read_text())
          assert r['status']=='ok' and r['maps']==2192 and r['production_changed'] is False
          assert c['status']=='ready' and c['file_count']==2192
          print('VNEXT AIFS FULL OK · 2192 ·',r['image_mib'],'MiB · fits single repo:',r['fits_single_model_pages_repo'])
          PY
      - name: Subir informe y muestras
        uses: actions/upload-artifact@v4
        with:
          name: vnext-aifs-full-resumen-y-muestras
          path: vnext-full-summary/aifs
          retention-days: 7
      - name: Protección producción
        run: |
          echo 'NO PUBLICA Pages.'
          echo 'NO modifica Mapas de WordPress.'
          echo 'AIFS sigue siendo candidato.'
