name: Fase 66W · Ensayo completo superficie + atmósfera

on:
  workflow_dispatch:
  push:
    branches: [phase66w-full-operational-dry-run]
    paths:
      - "scripts/phase66w_surface_full.py"
      - "scripts/build_phase66w_release.py"
      - "scripts/smoke_phase66w_surface.py"
      - ".github/workflows/phase66w-full-operational-dry-run.yml"

permissions:
  contents: read
  actions: read

jobs:
  select:
    name: Fijar ciclos 66V para el ensayo 66W
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      ecmwf_run: ${{ steps.cycles.outputs.ecmwf_run }}
      gfs_run: ${{ steps.cycles.outputs.gfs_run }}
      icon_run: ${{ steps.cycles.outputs.icon_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validar sintaxis de selección y 66W
        run: python -m py_compile scripts/phase66v_select_full_cycle.py scripts/phase66w_surface_full.py scripts/build_phase66w_release.py scripts/smoke_phase66w_surface.py
      - name: Fijar una pasada completa por modelo
        id: cycles
        shell: bash
        run: |
          set -euo pipefail
          python scripts/phase66v_select_full_cycle.py ecmwf | tee /tmp/ecmwf.log
          ECMWF_RUN="$(tail -n 1 /tmp/ecmwf.log)"
          python scripts/phase66v_select_full_cycle.py gfs | tee /tmp/gfs.log
          GFS_RUN="$(tail -n 1 /tmp/gfs.log)"
          python scripts/phase66v_select_full_cycle.py icon | tee /tmp/icon.log
          ICON_RUN="$(tail -n 1 /tmp/icon.log)"
          python - <<PY
          from datetime import datetime
          for n,v in {'ecmwf':'$ECMWF_RUN','gfs':'$GFS_RUN','icon':'$ICON_RUN'}.items():
              d=datetime.fromisoformat(v.replace('Z','+00:00')); assert d.tzinfo is not None
              print(n,d.isoformat())
          PY
          echo "ecmwf_run=$ECMWF_RUN" >> "$GITHUB_OUTPUT"
          echo "gfs_run=$GFS_RUN" >> "$GITHUB_OUTPUT"
          echo "icon_run=$ICON_RUN" >> "$GITHUB_OUTPUT"

  surface:
    name: Superficie completa · ${{ matrix.label }}
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - model: ecmwf
            label: ECMWF IFS · +360 h
            expected: 423
            horizon: 360
          - model: gfs
            label: NOAA GFS · +384 h
            expected: 644
            horizon: 384
          - model: icon
            label: DWD ICON-EU · +120 h
            expected: 558
            horizon: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generar superficie con ciclo fijado
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.model }}" in
            ecmwf) RUN="${{ needs.select.outputs.ecmwf_run }}" ;;
            gfs) RUN="${{ needs.select.outputs.gfs_run }}" ;;
            icon) RUN="${{ needs.select.outputs.icon_run }}" ;;
          esac
          python scripts/phase66w_surface_full.py "${{ matrix.model }}" "$RUN"
      - name: Validar paquete de superficie
        env:
          MODEL: ${{ matrix.model }}
          EXPECTED: ${{ matrix.expected }}
          HORIZON: ${{ matrix.horizon }}
          ECMWF_RUN: ${{ needs.select.outputs.ecmwf_run }}
          GFS_RUN: ${{ needs.select.outputs.gfs_run }}
          ICON_RUN: ${{ needs.select.outputs.icon_run }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          model=os.environ['MODEL']; base=Path('candidate-phase66w-surface')/model
          d=json.loads((base/'manifest-phase66w-surface.json').read_text(encoding='utf-8'))
          run={'ecmwf':os.environ['ECMWF_RUN'],'gfs':os.environ['GFS_RUN'],'icon':os.environ['ICON_RUN']}[model]
          expected=int(os.environ['EXPECTED']); horizon=int(os.environ['HORIZON'])
          assert d['phase']=='66W' and d['status']=='ok' and d['production_changed'] is False
          assert d['run_utc']==run and d['horizon_hours']==horizon
          assert d['summary']['map_files']==expected and len(list(base.rglob('*.webp')))==expected
          if model=='gfs': assert d['snow_semantics'].startswith('SNOD') and 'cm' in d['snow_semantics']
          else: assert 'equivalente en agua' in d['snow_semantics']
          print(model,'superficie 66W OK',expected,'mapas · ciclo',run)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fase66w-surface-${{ matrix.model }}
          path: candidate-phase66w-surface/${{ matrix.model }}/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  aloft:
    name: Atmósfera · ${{ matrix.label }} · ciclos 66W
    needs: [select, surface]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - slug: 500hpa
            phase: 66J
            phase_lc: 66j
            label: 500 hPa
            input: phase66j-input
            output: experimental-phase66j
            builder: build_phase66j_maplibre_viewer.py
          - slug: 850hpa
            phase: 66K
            phase_lc: 66k
            label: 850 hPa
            input: phase66k-input
            output: experimental-phase66k
            builder: build_phase66k_maplibre_viewer.py
          - slug: 700hpa
            phase: 66L
            phase_lc: 66l
            label: 700 hPa
            input: phase66l-input
            output: experimental-phase66l
            builder: build_phase66l_maplibre_viewer.py
          - slug: 925hpa
            phase: 66M
            phase_lc: 66m
            label: 925 hPa
            input: phase66m-input
            output: experimental-phase66m
            builder: build_phase66m_maplibre_viewer.py
          - slug: 300hpa
            phase: 66N
            phase_lc: 66n
            label: 300 hPa
            input: phase66n-input
            output: experimental-phase66n
            builder: build_phase66n_maplibre_viewer.py
          - slug: 250hpa
            phase: 66O
            phase_lc: 66o
            label: 250 hPa
            input: phase66o-input
            output: experimental-phase66o
            builder: build_phase66o_maplibre_viewer.py
          - slug: 200hpa
            phase: 66P
            phase_lc: 66p
            label: 200 hPa
            input: phase66p-input
            output: experimental-phase66p
            builder: build_phase66p_maplibre_viewer.py
          - slug: jet300
            phase: 66Q
            phase_lc: 66q
            label: Jet 300 hPa
            input: phase66q-input
            output: experimental-phase66q
            builder: build_phase66q_maplibre_viewer.py
          - slug: jet250
            phase: 66R
            phase_lc: 66r
            label: Jet 250 hPa
            input: phase66r-input
            output: experimental-phase66r
            builder: build_phase66r_maplibre_viewer.py
          - slug: jet200
            phase: 66S
            phase_lc: 66s
            label: Jet 200 hPa
            input: phase66s-input
            output: experimental-phase66s
            builder: build_phase66s_maplibre_viewer.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generar ECMWF con ciclo 66W
        run: python scripts/phase66u_run_layer.py "${{ matrix.slug }}" ecmwf "${{ needs.select.outputs.ecmwf_run }}"
      - name: Generar GFS con ciclo 66W
        run: python scripts/phase66u_run_layer.py "${{ matrix.slug }}" gfs "${{ needs.select.outputs.gfs_run }}"
      - name: Generar ICON-EU con ciclo 66W
        run: python scripts/phase66u_run_layer.py "${{ matrix.slug }}" icon "${{ needs.select.outputs.icon_run }}"
      - name: Validar 307 mapas y ciclos
        env:
          INPUT_DIR: ${{ matrix.input }}
          PHASE_LC: ${{ matrix.phase_lc }}
          PHASE: ${{ matrix.phase }}
          ECMWF_RUN: ${{ needs.select.outputs.ecmwf_run }}
          GFS_RUN: ${{ needs.select.outputs.gfs_run }}
          ICON_RUN: ${{ needs.select.outputs.icon_run }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ['INPUT_DIR']); exp={'ecmwf':os.environ['ECMWF_RUN'],'gfs':os.environ['GFS_RUN'],'icon':os.environ['ICON_RUN']}; wanted={'ecmwf':(85,360),'gfs':(129,384),'icon':(93,120)}
          for model,(count,horizon) in wanted.items():
              d=json.loads((base/model/f"manifest-phase{os.environ['PHASE_LC']}.json").read_text(encoding='utf-8'))
              assert d['phase']==os.environ['PHASE'] and d['status']=='ok' and d['run_utc']==exp[model]
              assert d['summary']=={'successes':count,'failures':0,'expected':count} and d['horizon_hours']==horizon
              assert len(list((base/model).glob('*.webp')))==count
          print(os.environ['PHASE'],'datos 307/307 y ciclos OK')
          PY
      - name: Construir visor MapLibre de capa
        run: python "scripts/${{ matrix.builder }}"
      - name: Validar visor 307/307
        env:
          OUTPUT_DIR: ${{ matrix.output }}
          PHASE_LC: ${{ matrix.phase_lc }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['OUTPUT_DIR']); r=json.loads((out/f"report-phase{os.environ['PHASE_LC']}.json").read_text(encoding='utf-8'))
          assert r['status']=='ok' and r['production_changed'] is False and r['total_maps']==307
          assert len(list(out.glob('*/*.webp')))==307
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fase66w-${{ matrix.slug }}
          path: ${{ matrix.output }}/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  master:
    name: 66W · 4695 mapas · navegador · publicación atómica y rollback
    needs: [select, surface, aloft]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: fase66w-*
          path: phase66w-down
      - name: Preparar diez capas atmosféricas
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          src=Path('phase66w-down'); out=Path('experimental-phase66u/layers')
          mapping={x:f'fase66w-{x}' for x in ['500hpa','850hpa','700hpa','925hpa','300hpa','250hpa','200hpa','jet300','jet250','jet200']}
          out.mkdir(parents=True,exist_ok=True)
          for slug,name in mapping.items():
              assert (src/name).is_dir(),(slug,name)
              shutil.copytree(src/name,out/slug)
          PY
      - name: Construir maestro atmosférico sincronizado
        run: python scripts/build_phase66u_master_viewer.py
      - name: Validar atmósfera 3070 y ciclos
        env:
          ECMWF_RUN: ${{ needs.select.outputs.ecmwf_run }}
          GFS_RUN: ${{ needs.select.outputs.gfs_run }}
          ICON_RUN: ${{ needs.select.outputs.icon_run }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('experimental-phase66u/report-phase66u.json').read_text(encoding='utf-8'))
          exp={'ecmwf':os.environ['ECMWF_RUN'],'gfs':os.environ['GFS_RUN'],'icon':os.environ['ICON_RUN']}
          assert r['status']=='ok' and r['total_maps']==3070 and r['selected_cycles']==exp
          assert all(v['same_cycle_across_layers'] and v['distinct_cycle_count']==1 for v in r['cycle_alignment'].values())
          assert len(list(Path('experimental-phase66u/layers').rglob('*.webp')))==3070
          PY
      - name: Instalar Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Probar atmósfera 30/30 en navegador real
        run: |
          python -m http.server 8778 --directory experimental-phase66u >/tmp/aloft-http.log 2>&1 &
          PID=$!; trap 'kill "$PID" || true' EXIT; sleep 2
          python scripts/smoke_phase66u_master.py
      - name: Construir release candidato 66W
        env:
          ECMWF_RUN: ${{ needs.select.outputs.ecmwf_run }}
          GFS_RUN: ${{ needs.select.outputs.gfs_run }}
          ICON_RUN: ${{ needs.select.outputs.icon_run }}
        run: python scripts/build_phase66w_release.py
      - name: Probar superficie 16/16 en navegador real
        run: |
          python -m http.server 8779 --directory candidate-phase66w >/tmp/surface-http.log 2>&1 &
          PID=$!; trap 'kill "$PID" || true' EXIT; sleep 2
          python scripts/smoke_phase66w_surface.py
      - name: Validación final 4695 + rollback
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('candidate-phase66w'); r=json.loads((root/'report-phase66w.json').read_text(encoding='utf-8')); rb=json.loads((root/'rollback-smoke-phase66w.json').read_text(encoding='utf-8')); bs=json.loads((root/'browser-smoke-surface-phase66w.json').read_text(encoding='utf-8'))
          assert r['phase']=='66W' and r['status']=='ok' and r['production_changed'] is False
          assert r['surface_maps']==1625 and r['aloft']['maps']==3070 and r['total_maps']==4695
          assert rb['status']=='ok' and rb['rollback_restored'] is True and rb['production_changed'] is False
          assert bs['status']=='ok' and bs['check_count']==16
          latest=json.loads((root/'latest.json').read_text(encoding='utf-8')); assert latest['status']=='staged' and latest['production_changed'] is False
          print('66W FINAL OK · 4695 mapas · 46 combinaciones navegador · rollback OK · sin producción')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fase66w-full-operational-dry-run
          path: candidate-phase66w/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
