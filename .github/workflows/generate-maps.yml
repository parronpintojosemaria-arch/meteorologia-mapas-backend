name: Generar mapas meteorológicos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ecmwf_surface_phase2.py"
      - "requirements.txt"
      - ".github/workflows/generate-maps.yml"
  schedule:
    - cron: "25 4,10,16,22 * * *"

permissions:
  contents: read

jobs:
  ecmwf-superficie-fase2:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar superficie ECMWF IFS
        env:
          FORECAST_STEPS: "0,3,6,9,12,18,24"
        run: python scripts/ecmwf_surface_phase2.py

      - name: Guardar mapas y manifiesto
        uses: actions/upload-artifact@v4
        with:
          name: meteorologia-mapas-ecmwf-superficie
          path: public/
          if-no-files-found: error
          retention-days: 7
