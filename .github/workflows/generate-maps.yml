name: Generar mapas meteorológicos

on:
  workflow_dispatch:
  schedule:
    - cron: "25 4,10,16,22 * * *"

permissions:
  contents: read

jobs:
  ecmwf-fase1:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar ECMWF T2m
        env:
          FORECAST_STEP: "0"
        run: python scripts/ecmwf_surface.py

      - uses: actions/upload-artifact@v4
        with:
          name: meteorologia-mapas-ecmwf
          path: public/
          if-no-files-found: error
          retention-days: 7
