name: Mapas IA · WeatherNext 3 BigQuery smoke

on:
  workflow_dispatch:
  push:
    branches:
      - vnext-mapas-ai-models
    paths:
      - 'scripts/vnext_weathernext3_bigquery_smoke.py'
      - '.github/workflows/vnext-weathernext3-bigquery-smoke.yml'

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    name: WeatherNext 3 superficie · lectura real
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WN3_PROJECT_ID: handy-curve-446117-h8
      WN3_DATASET_ID: weathernext_3

    steps:
      - uses: actions/checkout@v4
        with:
          ref: vnext-mapas-ai-models

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Autenticar Google Cloud por OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/998845699164/locations/global/workloadIdentityPools/meteorologia-github/providers/github
          service_account: meteorologia-github@handy-curve-446117-h8.iam.gserviceaccount.com

      - name: Dependencias
        run: pip install google-cloud-bigquery

      - name: Compilar
        run: python -m py_compile scripts/vnext_weathernext3_bigquery_smoke.py

      - name: Consultar WeatherNext 3
        run: python scripts/vnext_weathernext3_bigquery_smoke.py

      - name: Validar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('vnext-weathernext3-bigquery-smoke/weathernext3-bigquery-smoke.json').read_text())
          assert d['status']=='ok'
          assert d['checks']['long_horizon_found'] is True
          assert d['checks']['lead_hours']==[1,24,120,360]
          assert d['checks']['credentials_embedded'] is False
          print('WEATHERNEXT 3 BIGQUERY OK · OIDC + superficie real')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: weathernext3-bigquery-smoke
          path: vnext-weathernext3-bigquery-smoke/weathernext3-bigquery-smoke.json
          retention-days: 7
