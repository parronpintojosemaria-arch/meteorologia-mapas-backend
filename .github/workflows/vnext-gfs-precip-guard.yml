name: vNext · GFS precipitación completa · guard +384 · sin publicar

on:
  workflow_dispatch:
  push:
    branches: [vnext-mapas-profesional]
    paths:
      - 'scripts/vnext_gfs_precip_guard.py'
      - '.github/workflows/vnext-gfs-precip-guard.yml'
      - 'vnext/config/domains.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: vnext-gfs-precip-guard-no-production
  cancel-in-progress: false

jobs:
  guard:
    name: GFS APCP + PRATE + tipo + nieve · +3/+384 · NOAA NOMADS
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compilar
        run: |
          python -m py_compile scripts/vnext_gfs_precip_guard.py
          python -m py_compile scripts/vnext_gfs_preflight.py
          python -m py_compile scripts/gfs_precip_snow_phase23.py
          python -m py_compile scripts/precip_type_intensity_phase30.py
      - name: Validar precipitación y nieve GFS
        run: python scripts/vnext_gfs_precip_guard.py
      - name: Guard científico 16/16 y anti-producción
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('vnext-gfs-precip-guard/manifest.json').read_text(encoding='utf-8'))
          assert m['status']=='ready'
          assert m['expected_checks']==16 and len(m['checks'])==16
          assert m['production_changed'] is False
          assert {x['domain'] for x in m['checks']}=={'spain','europe'}
          assert {'precipitation_total','precipitation_rate','precipitation_type','snow_depth'} <= {x['product'] for x in m['checks']}
          print('VNEXT GFS PRECIP GUARD OK · 16/16 · ciclo',m['cycle'])
          PY
      - name: Subir manifiesto
        uses: actions/upload-artifact@v4
        with:
          name: vnext-gfs-precip-guard
          path: vnext-gfs-precip-guard/manifest.json
          retention-days: 7
      - name: Protección producción
        run: |
          echo 'NO PUBLICA Pages.'
          echo 'NO cambia current.json real.'
          echo 'NO modifica Schema66 ni WordPress.'
