name: Publicar ECMWF y GFS en GitHub Pages · horizonte completo + precipitación

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "scripts/timeline_phase29.py"
      - "scripts/max_horizon_phase28.py"
      - "scripts/precip_type_intensity_phase30.py"
      - "scripts/precip_timeline_phase32.py"
      - "scripts/ecmwf_surface_phase2.py"
      - "scripts/ecmwf_pressure_levels_phase4.py"
      - "scripts/ecmwf_jet_phase11.py"
      - "scripts/gfs_temperature_phase20.py"
      - "scripts/gfs_surface_phase21.py"
      - "scripts/gfs_precip_snow_phase23.py"
      - "scripts/gfs_pressure_phase24.py"
      - "scripts/gfs_jet_phase25.py"
      - "requirements.txt"
      - ".github/workflows/publish-ecmwf-pages.yml"
  schedule:
    - cron: "45 4,10,16,22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  EXPECTED_ECMWF_MAIN: "223"
  EXPECTED_GFS_MAIN: "239"
  EXPECTED_ECMWF_PRECIP: "36"
  EXPECTED_GFS_PRECIP: "38"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ecmwf-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generar ECMWF principal hasta +360 h
        run: python scripts/timeline_phase29.py ecmwf
      - name: Generar ECMWF tipo e intensidad hasta +360 h
        run: python scripts/precip_timeline_phase32.py ecmwf
      - name: Validar ECMWF completo y mismo ciclo
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          main_base=Path('public-phase29/ecmwf')
          precip_base=Path('public-phase30/ecmwf')
          main=json.loads((main_base/'manifest-phase29-ecmwf.json').read_text(encoding='utf-8'))
          precip=json.loads((precip_base/'manifest-phase30-ecmwf.json').read_text(encoding='utf-8'))
          p32=json.loads((precip_base/'manifest-phase32-ecmwf.json').read_text(encoding='utf-8'))
          em=int(os.environ['EXPECTED_ECMWF_MAIN']); ep=int(os.environ['EXPECTED_ECMWF_PRECIP'])
          if main.get('status')!='ok' or main.get('horizon_hours')!=360:
              raise SystemExit(f'ECMWF principal inválido: {main.get("status")} / {main.get("horizon_hours")}')
          if main.get('summary',{}).get('successes')!=em or main.get('summary',{}).get('failures')!=0:
              raise SystemExit(f'ECMWF principal incompleto: {main.get("summary")}')
          if precip.get('status')!='ok' or precip.get('summary',{}).get('successes')!=ep or precip.get('summary',{}).get('failures')!=0:
              raise SystemExit(f'ECMWF precipitación incompleta: {precip.get("summary")}')
          if p32.get('status')!='ok' or p32.get('horizon_hours')!=360 or p32.get('summary',{}).get('successes')!=ep:
              raise SystemExit(f'ECMWF Fase 32 inválida: {p32}')
          if main.get('run_utc')!=precip.get('run_utc') or main.get('run_utc')!=p32.get('run_utc'):
              raise SystemExit(f'ECMWF mezcla ciclos: main={main.get("run_utc")} precip={precip.get("run_utc")} p32={p32.get("run_utc")}')
          if len(list(main_base.rglob('*.webp')))!=em or len(list(precip_base.rglob('*.webp')))!=ep:
              raise SystemExit('ECMWF: número de WebP inesperado')
          stage=Path('pages/ecmwf'); stage.mkdir(parents=True,exist_ok=True)
          shutil.copytree(main_base,stage,dirs_exist_ok=True)
          shutil.copytree(precip_base,stage,dirs_exist_ok=True)
          print('ECMWF validado:', em, '+', ep, 'mapas · ciclo', main.get('run_utc'))
          PY
      - name: Subir ECMWF
        uses: actions/upload-artifact@v4
        with:
          name: pages-ecmwf-timeline
          path: pages/ecmwf/
          if-no-files-found: error
          retention-days: 2

  gfs-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generar GFS principal hasta +384 h
        run: python scripts/timeline_phase29.py gfs
      - name: Generar GFS tipo e intensidad hasta +384 h
        run: python scripts/precip_timeline_phase32.py gfs
      - name: Validar GFS completo y mismo ciclo
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          main_base=Path('public-phase29/gfs')
          precip_base=Path('public-phase30/gfs')
          main=json.loads((main_base/'manifest-phase29-gfs.json').read_text(encoding='utf-8'))
          precip=json.loads((precip_base/'manifest-phase30-gfs.json').read_text(encoding='utf-8'))
          p32=json.loads((precip_base/'manifest-phase32-gfs.json').read_text(encoding='utf-8'))
          gm=int(os.environ['EXPECTED_GFS_MAIN']); gp=int(os.environ['EXPECTED_GFS_PRECIP'])
          if main.get('status')!='ok' or main.get('horizon_hours')!=384:
              raise SystemExit(f'GFS principal inválido: {main.get("status")} / {main.get("horizon_hours")}')
          if main.get('summary',{}).get('successes')!=gm or main.get('summary',{}).get('failures')!=0:
              raise SystemExit(f'GFS principal incompleto: {main.get("summary")}')
          if precip.get('status')!='ok' or precip.get('summary',{}).get('successes')!=gp or precip.get('summary',{}).get('failures')!=0:
              raise SystemExit(f'GFS precipitación incompleta: {precip.get("summary")}')
          if p32.get('status')!='ok' or p32.get('horizon_hours')!=384 or p32.get('summary',{}).get('successes')!=gp:
              raise SystemExit(f'GFS Fase 32 inválida: {p32}')
          if main.get('run_utc')!=precip.get('run_utc') or main.get('run_utc')!=p32.get('run_utc'):
              raise SystemExit(f'GFS mezcla ciclos: main={main.get("run_utc")} precip={precip.get("run_utc")} p32={p32.get("run_utc")}')
          if len(list(main_base.rglob('*.webp')))!=gm or len(list(precip_base.rglob('*.webp')))!=gp:
              raise SystemExit('GFS: número de WebP inesperado')
          stage=Path('pages/gfs'); stage.mkdir(parents=True,exist_ok=True)
          shutil.copytree(main_base,stage,dirs_exist_ok=True)
          shutil.copytree(precip_base,stage,dirs_exist_ok=True)
          print('GFS validado:', gm, '+', gp, 'mapas · ciclo', main.get('run_utc'))
          PY
      - name: Subir GFS
        uses: actions/upload-artifact@v4
        with:
          name: pages-gfs-timeline
          path: pages/gfs/
          if-no-files-found: error
          retention-days: 2

  deploy:
    needs: [ecmwf-timeline, gfs-timeline]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar directorios
        run: mkdir -p _site/ecmwf _site/gfs
      - name: Descargar ECMWF
        uses: actions/download-artifact@v4
        with:
          name: pages-ecmwf-timeline
          path: _site/ecmwf
      - name: Descargar GFS
        uses: actions/download-artifact@v4
        with:
          name: pages-gfs-timeline
          path: _site/gfs
      - name: Validar paquete web completo
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('_site')
          configs=[
              ('ecmwf','manifest-phase29-ecmwf.json','manifest-phase30-ecmwf.json','manifest-phase32-ecmwf.json',360,int(os.environ['EXPECTED_ECMWF_MAIN']),int(os.environ['EXPECTED_ECMWF_PRECIP'])),
              ('gfs','manifest-phase29-gfs.json','manifest-phase30-gfs.json','manifest-phase32-gfs.json',384,int(os.environ['EXPECTED_GFS_MAIN']),int(os.environ['EXPECTED_GFS_PRECIP']))
          ]
          for folder,main_name,precip_name,p32_name,horizon,expected_main,expected_precip in configs:
              base=root/folder
              main=json.loads((base/main_name).read_text(encoding='utf-8'))
              precip=json.loads((base/precip_name).read_text(encoding='utf-8'))
              p32=json.loads((base/p32_name).read_text(encoding='utf-8'))
              if main.get('status')!='ok' or main.get('horizon_hours')!=horizon:
                  raise SystemExit(f'{folder}: principal no válido')
              if precip.get('status')!='ok' or p32.get('status')!='ok' or p32.get('horizon_hours')!=horizon:
                  raise SystemExit(f'{folder}: precipitación no válida')
              if not (main.get('run_utc')==precip.get('run_utc')==p32.get('run_utc')):
                  raise SystemExit(f'{folder}: ciclos mezclados')
              images=[]
              def walk(x):
                  if isinstance(x,dict):
                      if x.get('status')=='ok' and x.get('image'): images.append(x['image'])
                      for v in x.values(): walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
              walk(main); walk(precip)
              expected=expected_main+expected_precip
              if len(images)!=expected:
                  raise SystemExit(f'{folder}: referencias={len(images)}, esperado={expected}')
              missing=[p for p in images if not (root/p).is_file()]
              if missing:
                  raise SystemExit(f'{folder}: faltan imágenes: {missing[:3]}')
              print(folder,'ok',expected,'mapas · ciclo',main.get('run_utc'))
          PY
      - name: Añadir visor
        run: |
          cp site/index.html _site/index.html
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir web de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
