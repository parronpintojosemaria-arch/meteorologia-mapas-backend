name: Publicar ECMWF en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/ecmwf_surface_phase2.py"
      - "scripts/ecmwf_pressure_levels_phase4.py"
      - "scripts/ecmwf_jet_phase11.py"
      - "requirements.txt"
      - ".github/workflows/publish-ecmwf-pages.yml"
  schedule:
    - cron: "45 4,10,16,22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar superficie ECMWF
        env:
          FORECAST_STEPS: "0,3,6,9,12,18,24"
        run: python scripts/ecmwf_surface_phase2.py

      - name: Generar niveles ECMWF
        env:
          PRESSURE_LEVELS: "925,850,700,500,300,250,200"
          FORECAST_STEPS: "0,12,24"
        run: python scripts/ecmwf_pressure_levels_phase4.py

      - name: Generar Jet Stream ECMWF 300 hPa
        env:
          JET_LEVEL: "300"
          FORECAST_STEPS: "0,12,24"
        run: python scripts/ecmwf_jet_phase11.py

      - name: Generar Jet Stream ECMWF 250 hPa
        env:
          JET_LEVEL: "250"
          FORECAST_STEPS: "0,12,24"
        run: python scripts/ecmwf_jet_phase11.py

      - name: Generar Jet Stream ECMWF 200 hPa
        env:
          JET_LEVEL: "200"
          FORECAST_STEPS: "0,12,24"
        run: python scripts/ecmwf_jet_phase11.py

      - name: Preparar web estática
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R public/. _site/
          cp -R public-pressure/. _site/
          cp -R public-jet/. _site/
          cp site/index.html _site/index.html
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir web de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
