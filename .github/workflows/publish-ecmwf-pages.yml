name: Publicar ECMWF y GFS en GitHub Pages · horizonte completo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "scripts/timeline_phase29.py"
      - "scripts/max_horizon_phase28.py"
      - "scripts/ecmwf_surface_phase2.py"
      - "scripts/ecmwf_pressure_levels_phase4.py"
      - "scripts/ecmwf_jet_phase11.py"
      - "scripts/gfs_temperature_phase20.py"
      - "scripts/gfs_surface_phase21.py"
      - "scripts/gfs_precip_snow_phase23.py"
      - "scripts/gfs_pressure_phase24.py"
      - "scripts/gfs_jet_phase25.py"
      - "requirements.txt"
      - ".github/workflows/publish-ecmwf-pages.yml"
  schedule:
    - cron: "45 4,10,16,22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  EXPECTED_ECMWF: "223"
  EXPECTED_GFS: "239"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  ecmwf-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generar ECMWF hasta +360 h
        run: python scripts/timeline_phase29.py ecmwf
      - name: Validar ECMWF completo
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          base=Path('public-phase29/ecmwf')
          data=json.loads((base/'manifest-phase29-ecmwf.json').read_text(encoding='utf-8'))
          expected=int(os.environ['EXPECTED_ECMWF'])
          summary=data.get('summary',{})
          files=list(base.rglob('*.webp'))
          if data.get('status')!='ok' or data.get('horizon_hours')!=360:
              raise SystemExit(f'ECMWF inválido: status={data.get("status")} horizonte={data.get("horizon_hours")}')
          if summary.get('successes')!=expected or summary.get('failures')!=0 or len(files)!=expected:
              raise SystemExit(f'ECMWF incompleto: {summary}, webp={len(files)}')
          print('ECMWF validado:', summary)
          PY
      - name: Subir ECMWF
        uses: actions/upload-artifact@v4
        with:
          name: pages-ecmwf-timeline
          path: public-phase29/ecmwf/
          if-no-files-found: error
          retention-days: 2

  gfs-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generar GFS hasta +384 h
        run: python scripts/timeline_phase29.py gfs
      - name: Validar GFS completo
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          base=Path('public-phase29/gfs')
          data=json.loads((base/'manifest-phase29-gfs.json').read_text(encoding='utf-8'))
          expected=int(os.environ['EXPECTED_GFS'])
          summary=data.get('summary',{})
          files=list(base.rglob('*.webp'))
          if data.get('status')!='ok' or data.get('horizon_hours')!=384:
              raise SystemExit(f'GFS inválido: status={data.get("status")} horizonte={data.get("horizon_hours")}')
          if summary.get('successes')!=expected or summary.get('failures')!=0 or len(files)!=expected:
              raise SystemExit(f'GFS incompleto: {summary}, webp={len(files)}')
          print('GFS validado:', summary)
          PY
      - name: Subir GFS
        uses: actions/upload-artifact@v4
        with:
          name: pages-gfs-timeline
          path: public-phase29/gfs/
          if-no-files-found: error
          retention-days: 2

  deploy:
    needs: [ecmwf-timeline, gfs-timeline]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar directorios
        run: mkdir -p _site/ecmwf _site/gfs
      - name: Descargar ECMWF
        uses: actions/download-artifact@v4
        with:
          name: pages-ecmwf-timeline
          path: _site/ecmwf
      - name: Descargar GFS
        uses: actions/download-artifact@v4
        with:
          name: pages-gfs-timeline
          path: _site/gfs
      - name: Validar paquete web
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('_site')
          configs=[('ecmwf','manifest-phase29-ecmwf.json',360,int(os.environ['EXPECTED_ECMWF'])),('gfs','manifest-phase29-gfs.json',384,int(os.environ['EXPECTED_GFS']))]
          for folder,name,horizon,expected in configs:
              base=root/folder
              data=json.loads((base/name).read_text(encoding='utf-8'))
              if data.get('status')!='ok' or data.get('horizon_hours')!=horizon:
                  raise SystemExit(f'{folder}: manifiesto no válido')
              images=[]
              def walk(x):
                  if isinstance(x,dict):
                      if x.get('status')=='ok' and x.get('image'): images.append(x['image'])
                      for v in x.values(): walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
              walk(data)
              if len(images)!=expected:
                  raise SystemExit(f'{folder}: referencias={len(images)}, esperado={expected}')
              missing=[p for p in images if not (root/p).is_file()]
              if missing:
                  raise SystemExit(f'{folder}: faltan imágenes: {missing[:3]}')
              print(folder, 'ok', len(images), 'mapas')
          PY
      - name: Añadir visor
        run: |
          cp site/index.html _site/index.html
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir web de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
