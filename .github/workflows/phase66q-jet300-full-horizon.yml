name: Fase 66Q · Jet Stream 300 hPa horizonte completo premium

on:
  workflow_dispatch:
  push:
    branches: [phase66q-jet300-full-horizon]
    paths:
      - "scripts/jet_300_full_phase66q.py"
      - "scripts/build_phase66q_maplibre_viewer.py"
      - "scripts/smoke_phase66q_maplibre.py"
      - "scripts/ecmwf_pressure_levels_phase4.py"
      - ".github/workflows/phase66q-jet300-full-horizon.yml"
      - "requirements.txt"

permissions:
  contents: read
  actions: read

jobs:
  generate:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: ecmwf
            label: ECMWF · Jet 300 hPa · 85 mapas · +360 h
            expected: 85
            horizon: 360
            artifact: fase66q-ecmwf-jet300-full
          - model: gfs
            label: GFS · Jet 300 hPa · 129 mapas · +384 h
            expected: 129
            horizon: 384
            artifact: fase66q-gfs-jet300-full
          - model: icon
            label: ICON-EU · Jet 300 hPa · 93 mapas · +120 h
            expected: 93
            horizon: 120
            artifact: fase66q-icon-eu-jet300-full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validar sintaxis y conversiones de altura
        run: |
          python -m py_compile scripts/jet_300_full_phase66q.py scripts/ecmwf_pressure_levels_phase4.py
          python - <<'PY'
          import sys
          import numpy as np
          sys.path.insert(0, 'scripts')
          import gfs_pressure_phase24 as g
          import ecmwf_pressure_levels_phase4 as e
          assert float(g.to_height_m(np.array([[10900.]],dtype='float32'),'m')[0,0]) == 10900.0
          z=e.geopotential_height(np.array([[98066.5]],dtype='float32'),'m**2 s**-2')
          assert abs(float(z[0,0])-10000.0) < 1.0
          print('Conversiones de altura GFS/ECMWF OK')
          PY
      - name: Generar horizonte completo Jet 300 hPa
        run: python scripts/jet_300_full_phase66q.py "${{ matrix.model }}"
      - name: Validar datos, cadencia y mapas Jet 300 hPa
        env:
          MODEL: ${{ matrix.model }}
          EXPECTED: ${{ matrix.expected }}
          HORIZON: ${{ matrix.horizon }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=os.environ['MODEL']; expected=int(os.environ['EXPECTED']); horizon=int(os.environ['HORIZON'])
          p=Path('experimental-phase66q')/m/'manifest-phase66q.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['phase']=='66Q' and d['status']=='ok' and d['level_hpa']==300, d.get('failure_notes')
          assert d['variable']=='jet_stream_wind_speed_geopotential'
          assert d['summary']=={'successes':expected,'failures':0,'expected':expected}, d['summary']
          assert d['horizon_hours']==horizon and max(d['generated_steps'])==horizon
          if m=='ecmwf': wanted=list(range(0,145,3))+list(range(150,361,6))
          elif m=='gfs': wanted=list(range(0,385,3))
          else: wanted=list(range(0,79))+list(range(81,121,3))
          assert d['generated_steps']==wanted
          assert len(list(p.parent.glob('*.webp')))==expected
          for sk,r in d['maps'].items():
              assert r['status']=='ok', (sk,r)
              s=r['size']; assert s['width']>s['height'] and s['width']>=1000, (sk,s)
              assert 6500 <= r['geopotential_height_mean_m'] <= 11500, (sk,r['geopotential_height_mean_m'])
              wr=r['wind_speed_range_kmh']
              assert 0 <= wr['min'] <= wr['max'] <= 650, (sk,wr)
              assert wr['max'] >= 60, (sk,wr)
              assert len(r['source_requests']) >= 3
              assert (p.parent/r['image']).is_file(), r['image']
          print(f"{m} 66Q validado {expected}/{expected} · Jet 300 hPa · horizonte +{horizon} h")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: experimental-phase66q/${{ matrix.model }}/
          retention-days: 7
          if-no-files-found: error

  viewer:
    name: MapLibre · Jet 300 hPa · 307 mapas · navegador real
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: fase66q-ecmwf-jet300-full
          path: phase66q-input/ecmwf
      - uses: actions/download-artifact@v4
        with:
          name: fase66q-gfs-jet300-full
          path: phase66q-input/gfs
      - uses: actions/download-artifact@v4
        with:
          name: fase66q-icon-eu-jet300-full
          path: phase66q-input/icon
      - name: Construir visor MapLibre 66Q
        run: |
          python -m py_compile scripts/build_phase66q_maplibre_viewer.py
          python scripts/build_phase66q_maplibre_viewer.py
      - name: Validar paquete Jet 300 hPa 307/307
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('experimental-phase66q')
          d=json.loads((out/'report-phase66q.json').read_text(encoding='utf-8'))
          assert d['phase']=='66Q' and d['status']=='ok' and d['level_hpa']==300
          assert d['variable']=='jet_stream_wind_speed_geopotential'
          assert d['production_changed'] is False
          assert d['total_maps']==307
          assert {k:v['maps'] for k,v in d['models'].items()}=={'ecmwf':85,'gfs':129,'icon':93}
          assert {k:v['horizon'] for k,v in d['models'].items()}=={'ecmwf':360,'gfs':384,'icon':120}
          assert len(list(out.glob('*/*.webp')))==307
          html=(out/'index.html').read_text(encoding='utf-8')
          for token in ('maplibregl.Map','OpenFreeMap','aspect-ratio:16/9','window.__phase66qState','Jet Stream 300 hPa','Dominio','km/h'):
              assert token in html, token
          assert 'leaflet' not in html.lower()
          print('66Q paquete estático OK · Jet 300 hPa · 307/307 · MapLibre')
          PY
      - name: Instalar Chromium de prueba
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Probar horizontes finales e intervalos Jet 300 hPa
        run: |
          python -m py_compile scripts/smoke_phase66q_maplibre.py
          python -m http.server 8774 --directory experimental-phase66q >/tmp/phase66q-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          python scripts/smoke_phase66q_maplibre.py
      - uses: actions/upload-artifact@v4
        with:
          name: fase66q-maplibre-jet300-full-horizon
          path: experimental-phase66q/
          retention-days: 7
          if-no-files-found: error
