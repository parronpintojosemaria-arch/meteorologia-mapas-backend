name: Fase 58 · ICON-EU lluvia por intervalo e intensidad

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/icon_eu_rain_interval_phase58.py'
      - '.github/workflows/icon-eu-rain-interval-phase58.yml'
  workflow_run:
    workflows: ['Fase 55 · ICON-EU producción operativa unificada']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  rain-interval:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Localizar producción ICON-EU operativa de origen
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "${EVENT_RUN_ID:-}" ]; then
            run_id="$EVENT_RUN_ID"
          else
            api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/icon-eu-operational-unified-phase55.yml/runs?status=success&per_page=20"
            run_id=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" | python -c "import json,sys; d=json.load(sys.stdin); runs=[r for r in d.get('workflow_runs',[]) if r.get('conclusion')=='success']; print(runs[0]['id'] if runs else '')")
          fi
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Fase 55 de origen: $run_id"

      - name: Descargar selector de la misma Fase 55
        uses: actions/download-artifact@v4
        with:
          name: icon-eu-operational-selector
          path: _selector
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Fijar exactamente la misma pasada ICON-EU
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('_selector/manifest-selector.json')
          if not p.exists():
              found=list(Path('_selector').rglob('manifest-selector.json'))
              if not found: raise SystemExit('No se encontró manifest-selector.json')
              p=found[0]
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('status')!='ok' or d.get('required_probe_count')!=29:
              raise SystemExit(f'Selector F55 inválido: {d.get("status")} probes={d.get("required_probe_count")}')
          run=d.get('selected_run_utc')
          if not run: raise SystemExit('Falta selected_run_utc')
          with open(__import__('os').environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write('ICON_EU_RUN_UTC='+run+'\n')
              f.write('ICON_EU_SOURCE_WORKFLOW_RUN_ID=${{ steps.source.outputs.run_id }}\n')
          print('run_utc=',run)
          print('probes=29/29')
          PY

      - name: Generar lluvia por intervalo e intensidad
        run: python scripts/icon_eu_rain_interval_phase58.py

      - name: Validar Fase 58
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('public-icon58/icon-eu/manifest-rain-interval-phase58.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          expected=list(range(1,79))+list(range(81,121,3))
          s=d.get('summary',{})
          if d.get('schema')!=58 or d.get('status')!='ok': raise SystemExit('Manifiesto F58 inválido')
          if d.get('run_utc')!=os.environ['ICON_EU_RUN_UTC']: raise SystemExit('F58 usa una pasada distinta')
          if d.get('forecast_steps')!=expected: raise SystemExit('Pasos F58 incorrectos')
          if s.get('successes')!=92 or s.get('failures')!=0 or s.get('expected')!=92 or s.get('map_files')!=92:
              raise SystemExit(f'Recuento F58 incorrecto: {s}')
          maps=list(Path('public-icon58/icon-eu/rain_interval_intensity').glob('*.webp'))
          if len(maps)!=92: raise SystemExit(f'WebP F58={len(maps)}, esperados 92')
          one=d['steps']['f001']; late=d['steps']['f081']
          if one.get('interval_hours')!=1 or late.get('interval_hours')!=3:
              raise SystemExit('Intervalos 1h/3h incorrectos')
          print('ICON-EU Fase 58 validada:',s,'run',d.get('run_utc'))
          PY

      - name: Subir lluvia por intervalo
        uses: actions/upload-artifact@v4
        with:
          name: meteorologia-mapas-icon-eu-rain-interval
          path: public-icon58/icon-eu/
          if-no-files-found: error
          retention-days: 7
