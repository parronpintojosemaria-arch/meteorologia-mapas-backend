name: Fase 67F · Candidato Schema66 HD completo · sin publicar

on:
  workflow_dispatch:
  push:
    branches: [phase67e-production-hd]
    paths:
      - ".github/workflows/phase67f-full-hd-candidate.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: phase67f-full-hd-candidate
  cancel-in-progress: true

jobs:
  candidate:
    name: 67F · reconstruir 4.861 mapas HD y medir Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Descargar los 36 artefactos 67C v3 sin compresión destructiva
        uses: actions/download-artifact@v4
        with:
          pattern: "fase67c-v3-*"
          path: _down
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34233511876

      - name: Reconstruir superficie y las 10 capas desde los originales
        shell: bash
        run: |
          set -euo pipefail
          rm -rf phase66w-down candidate-phase66w-surface experimental-phase66u candidate-phase66w
          mkdir -p phase66w-down candidate-phase66w-surface experimental-phase66u/layers

          for m in ecmwf gfs icon; do
            mkdir -p "phase66w-down/fase66w-surface-$m" "candidate-phase66w-surface/$m"
            cp -a "_down/fase67c-v3-surface-$m/." "phase66w-down/fase66w-surface-$m/"
            cp -a "_down/fase67c-v3-surface-$m/." "candidate-phase66w-surface/$m/"
          done

          for slug in 500hpa 850hpa 700hpa 925hpa 300hpa 250hpa 200hpa jet300 jet250 jet200; do
            case "$slug" in
              500hpa) INPUT=phase66j-input; OUTPUT=experimental-phase66j; BUILDER=build_phase66j_maplibre_viewer.py;;
              850hpa) INPUT=phase66k-input; OUTPUT=experimental-phase66k; BUILDER=build_phase66k_maplibre_viewer.py;;
              700hpa) INPUT=phase66l-input; OUTPUT=experimental-phase66l; BUILDER=build_phase66l_maplibre_viewer.py;;
              925hpa) INPUT=phase66m-input; OUTPUT=experimental-phase66m; BUILDER=build_phase66m_maplibre_viewer.py;;
              300hpa) INPUT=phase66n-input; OUTPUT=experimental-phase66n; BUILDER=build_phase66n_maplibre_viewer.py;;
              250hpa) INPUT=phase66o-input; OUTPUT=experimental-phase66o; BUILDER=build_phase66o_maplibre_viewer.py;;
              200hpa) INPUT=phase66p-input; OUTPUT=experimental-phase66p; BUILDER=build_phase66p_maplibre_viewer.py;;
              jet300) INPUT=phase66q-input; OUTPUT=experimental-phase66q; BUILDER=build_phase66q_maplibre_viewer.py;;
              jet250) INPUT=phase66r-input; OUTPUT=experimental-phase66r; BUILDER=build_phase66r_maplibre_viewer.py;;
              jet200) INPUT=phase66s-input; OUTPUT=experimental-phase66s; BUILDER=build_phase66s_maplibre_viewer.py;;
            esac
            rm -rf "$INPUT" "$OUTPUT"
            mkdir -p "$INPUT"
            for m in ecmwf gfs icon; do
              mkdir -p "$INPUT/$m"
              cp -a "_down/fase67c-v3-$slug-$m/." "$INPUT/$m/"
            done
            python "scripts/$BUILDER"
            mkdir -p "experimental-phase66u/layers/$slug"
            cp -a "$OUTPUT/." "experimental-phase66u/layers/$slug/"
          done
          python scripts/build_phase66u_master_viewer.py

      - name: Construir núcleo Schema66 de 4.695 mapas
        env:
          ECMWF_RUN: 2026-09-08T00:00:00+00:00
          GFS_RUN: 2026-09-08T06:00:00+00:00
          ICON_RUN: 2026-09-08T06:00:00+00:00
        run: |
          python scripts/build_phase66w_release.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('candidate-phase66w/report-phase66w.json').read_text())
          assert r['status']=='ok' and r['schema']==66 and r['phase']=='66W'
          assert r['surface_maps']==1625 and r['aloft']['maps']==3070 and r['total_maps']==4695
          release=Path('candidate-phase66w/releases')/r['release_id']
          assert release.is_dir()
          assert len(list(release.rglob('*.webp')))==4695
          print('67F núcleo 4695 OK',r['release_id'])
          PY

      - name: Montar sitio candidato v66 y añadir los 166 extras
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _extras
          mkdir -p _site
          python - <<'PY'
          import json, shutil
          from datetime import datetime, timezone
          from pathlib import Path
          src=Path('candidate-phase66w')
          site=Path('_site')
          report=json.loads((src/'report-phase66w.json').read_text())
          release_id=report['release_id']
          source_release=src/'releases'/release_id
          v66=site/'v66'; target=v66/'releases'/release_id
          target.parent.mkdir(parents=True,exist_ok=True)
          shutil.copytree(source_release,target)
          now=datetime.now(timezone.utc).isoformat()
          latest={
            'schema':66,'phase':'67F','status':'staged','release_id':release_id,
            'base_path':f'releases/{release_id}','surface_path':f'releases/{release_id}/surface',
            'aloft_path':f'releases/{release_id}/aloft','selected_cycles':report['selected_cycles'],
            'surface':report['surface'],'aloft':report['aloft'],'surface_maps':1625,
            'aloft_maps':3070,'total_maps':4695,'production_changed':False,
            'source_phase':'67F','created_at_utc':now
          }
          health={
            'schema':66,'phase':'67F','status':'ok','release_id':release_id,
            'surface_maps':1625,'aloft_maps':3070,'total_maps':4695,
            'production_changed':False,'checked_at_utc':now
          }
          (v66/'latest.json').write_text(json.dumps(latest,ensure_ascii=False,indent=2)+'\n')
          (v66/'health.json').write_text(json.dumps(health,ensure_ascii=False,indent=2)+'\n')
          (v66/'report-phase67f-core.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          (site/'.nojekyll').write_text('')
          PY

          PHASE66X_SITE_DIR=_site python scripts/phase66x_build_catalog.py
          mkdir -p _extras/ecmwf _extras/gfs _extras/icon
          cp -a _down/fase67c-v3-extra-ecmwf/. _extras/ecmwf/
          cp -a _down/fase67c-v3-extra-gfs/. _extras/gfs/
          cp -a _down/fase67c-v3-extra-icon/. _extras/icon/
          PHASE66Y_SITE_DIR=_site PHASE66Y_EXTRA_DIR=_extras python scripts/phase66y_merge_extras.py

      - name: Validar catálogo completo antes de optimizar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('_site/v66')
          c=json.loads((root/'catalog.json').read_text())
          release=root/c['base_path']
          assert c['schema']==66 and c['status']=='ok'
          assert c['summary']['total_maps']==4861
          assert c['compatibility']['ready_for_plugin_cutover'] is True
          assert len(list(release.rglob('*.webp')))==4861
          print('67F Schema66 completo OK · 4861 mapas')
          PY

      - name: Optimizar a HD 1600 q78 sin legado duplicado
        run: |
          python - <<'PY'
          from concurrent.futures import ProcessPoolExecutor
          from pathlib import Path
          from PIL import Image
          import json, os

          root=Path('_site')
          v66=root/'v66'
          cat=json.loads((v66/'catalog.json').read_text())
          release=v66/cat['base_path']
          files=sorted(release.rglob('*.webp'))
          assert len(files)==4861

          def tree_bytes(p):
              return sum(x.stat().st_size for x in Path(p).rglob('*') if x.is_file())

          def recode(arg):
              raw,maxw,q=arg
              p=Path(raw); tmp=p.with_suffix('.tmp.webp')
              with Image.open(p) as im:
                  im.load(); im=im.convert('RGBA')
                  if im.width>maxw:
                      nh=max(1,round(im.height*maxw/im.width))
                      im=im.resize((maxw,nh),Image.Resampling.LANCZOS)
                  im.save(tmp,'WEBP',quality=q,method=6)
              with Image.open(tmp) as chk: chk.verify()
              os.replace(tmp,p)

          profiles=[(1600,78),(1500,76),(1400,74)]
          chosen=None
          for maxw,q in profiles:
              print(f'67F perfil {maxw}px q{q}',flush=True)
              with ProcessPoolExecutor(max_workers=4) as ex:
                  list(ex.map(recode,[(str(p),maxw,q) for p in files],chunksize=8))
              total=tree_bytes(root)
              chosen={'max_width':maxw,'quality':q,'site_mib':round(total/1024/1024,2),'v66_mib':round(tree_bytes(v66)/1024/1024,2)}
              print('67F tamaño',chosen,flush=True)
              if total <= 940*1024*1024:
                  break

          widths=[]; heights=[]; sizes=[]
          for i,p in enumerate(files):
              with Image.open(p) as im:
                  im.verify(); widths.append(im.width); heights.append(im.height)
              sizes.append(p.stat().st_size)
              if i%500==0: print(f'67F verificados {i+1}/{len(files)}',flush=True)
          total=tree_bytes(root)
          assert total <= 940*1024*1024, f'Candidato aún excede Pages: {total/1024/1024:.1f} MiB'
          chosen.update({
              'maps':len(files),
              'median_width':sorted(widths)[len(widths)//2],
              'min_width':min(widths),'max_width':max(widths),
              'median_height':sorted(heights)[len(heights)//2],
              'average_kib':round(sum(sizes)/len(sizes)/1024,1),
              'production_changed':False,
              'legacy_rasters_in_candidate':False
          })
          Path('_site/v66/phase67f-hd.json').write_text(json.dumps(chosen,indent=2,ensure_ascii=False)+'\n')
          Path('_67f_profile.json').write_text(json.dumps(chosen,indent=2,ensure_ascii=False)+'\n')
          print('67F CANDIDATO HD OK',json.dumps(chosen,ensure_ascii=False),flush=True)
          PY

      - name: Preparar informe y muestras representativas
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _67f_report
          mkdir -p _67f_report/samples
          cp _67f_profile.json _67f_report/phase67f-profile.json
          cp _site/v66/catalog.json _67f_report/catalog.json
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from PIL import Image
          prof=json.loads(Path('_67f_profile.json').read_text())
          root=Path('_site/v66')
          cat=json.loads((root/'catalog.json').read_text())
          release=root/cat['base_path']
          files=sorted(release.rglob('*.webp'))
          tokens=['precipitation_total','wind_10m','cloud_cover_total','temperature_2m','500hpa','jet']
          picked=[]
          for token in tokens:
              matches=[p for p in files if token in str(p).lower()]
              if matches:
                  p=matches[len(matches)//2]
                  dst=Path('_67f_report/samples')/(token+'-'+p.name)
                  shutil.copy2(p,dst); picked.append(str(dst.name))
          lines=[
            '# Fase 67F · candidato Schema66 HD', '',
            '- Producción modificada: **NO**',
            '- Mapas: **4.861**',
            f'- Perfil elegido: **{prof["max_width"]} px · WebP q{prof["quality"]}**',
            f'- Tamaño candidato: **{prof["site_mib"]} MiB**',
            f'- Anchura mediana: **{prof["median_width"]} px**',
            f'- Peso medio: **{prof["average_kib"]} KiB/mapa**',
            '- Legado ráster duplicado: **NO**',
            '', '## Muestras', *['- '+x for x in picked]
          ]
          Path('_67f_report/README.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: fase67f-candidato-schema66-hd
          path: _67f_report/
          retention-days: 7
          compression-level: 0
