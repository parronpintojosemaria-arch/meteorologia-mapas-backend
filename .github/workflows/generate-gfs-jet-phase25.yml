name: Generar GFS Jet Stream Fase 25

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gfs_jet_phase25.py"
      - "requirements.txt"
      - ".github/workflows/generate-gfs-jet-phase25.yml"

jobs:
  gfs-fase25:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Generar Jet Stream GFS
        run: python scripts/gfs_jet_phase25.py
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: meteorologia-mapas-gfs-fase25
          path: public-gfs25/
          if-no-files-found: error
          retention-days: 7
