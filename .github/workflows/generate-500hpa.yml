name: Generar ECMWF 500 hPa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ecmwf_500hpa_phase3.py"
      - "requirements.txt"
      - ".github/workflows/generate-500hpa.yml"

permissions:
  contents: read

jobs:
  ecmwf-500hpa-fase3:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar ECMWF 500 hPa
        env:
          FORECAST_STEPS: "0,12,24"
        run: python scripts/ecmwf_500hpa_phase3.py

      - name: Guardar mapas 500 hPa
        uses: actions/upload-artifact@v4
        with:
          name: meteorologia-mapas-ecmwf-500hpa
          path: public500/
          if-no-files-found: error
          retention-days: 7
