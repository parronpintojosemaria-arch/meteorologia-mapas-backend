name: Fase 32 · Tipo e intensidad en toda la línea temporal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/precip_timeline_phase32.py"
      - "scripts/precip_type_intensity_phase30.py"
      - "scripts/gfs_precip_batch_phase57.py"
      - "scripts/ecmwf_surface_phase2.py"
      - "scripts/gfs_temperature_phase20.py"
      - "scripts/gfs_surface_phase21.py"
      - "scripts/max_horizon_phase28.py"
      - "requirements.txt"
      - ".github/workflows/precip-timeline-phase32.yml"

permissions:
  contents: read

jobs:
  ecmwf-precip-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generar ECMWF tipo e intensidad hasta +360 h
        run: python scripts/precip_timeline_phase32.py ecmwf
      - name: Verificar ECMWF 36/36
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public-phase30/ecmwf/manifest-phase32-ecmwf.json')
          d=json.loads(p.read_text())
          s=d['summary']
          assert d['status']=='ok' and d['horizon_hours']==360
          assert s=={'successes':36,'failures':0,'expected':36}, s
          print('ECMWF precipitación completa:', s)
          PY
      - name: Subir ECMWF
        uses: actions/upload-artifact@v4
        with:
          name: meteorologia-ecmwf-fase32-precip-timeline360
          path: public-phase30/ecmwf
          retention-days: 7

  gfs-precip-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fijar una pasada GFS completa hasta +384 h
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          import max_horizon_phase28 as p28
          run_dt=p28.pick_gfs_run()
          base=Path('public-phase29/gfs')
          base.mkdir(parents=True,exist_ok=True)
          (base/'manifest-phase29-gfs.json').write_text(json.dumps({
              'schema':29,
              'model':'NOAA GFS',
              'data_provider':'NOAA/NCEP NOMADS',
              'run_utc':run_dt.isoformat(),
              'horizon_hours':384,
              'status':'ok'
          },indent=2),encoding='utf-8')
          print('Pasada GFS fijada para Fase 32:',run_dt.isoformat())
          PY
      - name: Generar GFS tipo e intensidad hasta +384 h
        run: python scripts/precip_timeline_phase32.py gfs
      - name: Verificar GFS 38/38
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public-phase30/gfs/manifest-phase32-gfs.json')
          d=json.loads(p.read_text())
          s=d['summary']
          assert d['status']=='ok' and d['horizon_hours']==384
          assert s=={'successes':38,'failures':0,'expected':38}, s
          print('GFS precipitación completa:', s)
          PY
      - name: Subir GFS
        uses: actions/upload-artifact@v4
        with:
          name: meteorologia-gfs-fase32-precip-timeline384
          path: public-phase30/gfs
          retention-days: 7
