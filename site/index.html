<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meteorología Interactiva · ECMWF IFS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#071528;color:#eef7ff;overflow:hidden}
*{box-sizing:border-box}.app{height:100%;display:flex;flex-direction:column;min-width:0}.top{padding:10px 12px;background:linear-gradient(135deg,#06294b,#0b4f84);box-shadow:0 2px 14px #0005;z-index:1001}.title{font-weight:800;font-size:16px}.sub{font-size:11px;opacity:.85;margin-top:2px}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.controls label{display:flex;flex-direction:column;gap:3px;font-size:10px;min-width:120px;flex:1}.controls select,.locationbox input{width:100%;min-width:0;border:1px solid #5fa8df;background:#fff;color:#10243a;border-radius:7px;padding:7px 8px;font-size:13px}.timeline{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:4px}.timeline button,.locationbox button{border:1px solid #5fa8df;background:#fff;color:#0a3558;border-radius:7px;padding:7px 6px;font-size:13px;font-weight:800;cursor:pointer;min-width:0}.timeline button:active,.locationbox button:active{transform:translateY(1px)}.timeline button[disabled],.locationbox button[disabled]{opacity:.45;cursor:default}.locationbox{display:grid;grid-template-columns:minmax(130px,1fr) auto auto;gap:4px}.locationbox button{white-space:nowrap}.status{margin-top:7px;font-size:11px;white-space:normal;overflow-wrap:anywhere}.mapwrap{position:relative;flex:1;min-height:0;min-width:0}#map{position:absolute;inset:0}.badge{position:absolute;z-index:900;left:9px;bottom:9px;max-width:calc(100% - 18px);background:rgba(5,20,37,.88);border:1px solid rgba(255,255,255,.2);color:#fff;padding:7px 9px;border-radius:8px;font-size:11px;line-height:1.35;pointer-events:none}.legend{position:absolute;z-index:900;right:9px;bottom:9px;width:min(290px,calc(100% - 18px));background:rgba(5,20,37,.90);border:1px solid rgba(255,255,255,.22);color:#fff;padding:8px 9px;border-radius:8px;font-size:10px;line-height:1.3;pointer-events:none}.legend-title{font-weight:800;margin-bottom:5px}.legend-bar{height:12px;border-radius:5px;border:1px solid rgba(255,255,255,.45);overflow:hidden}.legend-scale{display:flex;justify-content:space-between;gap:5px;margin-top:3px;font-variant-numeric:tabular-nums}.legend-note{margin-top:4px;opacity:.86}.leaflet-control-attribution{font-size:9px!important}@media(max-width:900px){.locationbox{grid-template-columns:minmax(110px,1fr) auto}.locationbox #myLocation{grid-column:1/-1}}@media(max-width:700px){.top{padding:8px}.title{font-size:14px}.controls{display:grid;grid-template-columns:1fr 1fr}.controls label{min-width:0}.status{font-size:10px}.legend{right:7px;bottom:7px;width:min(245px,calc(100% - 14px));font-size:9px}.badge{left:7px;bottom:7px;max-width:calc(100% - 14px)}}@media(max-width:520px){.badge{bottom:88px;max-width:calc(100% - 14px)}.legend{width:calc(100% - 14px)}}@media(max-width:420px){.controls{grid-template-columns:1fr}.controls select,.timeline button,.locationbox input,.locationbox button{font-size:12px;padding:6px 7px}.locationbox{grid-template-columns:1fr 1fr}.locationbox input{grid-column:1/-1}.locationbox #myLocation{grid-column:auto}.top{max-height:52vh;overflow:auto}.badge{font-size:10px}}
</style>
</head>
<body><div class="app"><header class="top"><div class="title">Meteorología Interactiva · ECMWF IFS</div><div class="sub">Datos ECMWF Open Data · mapa ligero Leaflet · sin WebGL</div><div class="controls"><label>Tipo<select id="kind"><option value="surface">Superficie</option><option value="pressure">Niveles de presión</option><option value="jet">Jet Stream</option></select></label><label id="varLabel">Variable<select id="variable"><option value="temperature_2m">Temperatura 2 m</option><option value="wind_10m">Viento 10 m</option><option value="cloud_cover_total">Nubosidad total</option><option value="precipitation_total">Precipitación acumulada</option><option value="snowfall_water_equivalent">Nieve · equivalente en agua</option></select></label><label id="levelLabel" style="display:none">Nivel<select id="level"><option>925</option><option>850</option><option>700</option><option>500</option><option>300</option><option>250</option><option>200</option></select></label><label id="jetLevelLabel" style="display:none">Nivel Jet<select id="jetLevel"><option>300</option><option selected>250</option><option>200</option></select></label><label>Pronóstico<select id="step"></select></label><label>Animación<div class="timeline"><button id="prevStep" type="button" title="Paso anterior" aria-label="Paso anterior">◀</button><button id="playStep" type="button" title="Reproducir animación" aria-label="Reproducir animación">▶ Reproducir</button><button id="nextStep" type="button" title="Paso siguiente" aria-label="Paso siguiente">▶</button></div></label><label>Ubicación<div class="locationbox"><input id="place" type="search" inputmode="search" autocomplete="off" placeholder="Buscar ciudad…" aria-label="Buscar ciudad"><button id="searchPlace" type="button">Buscar</button><button id="myLocation" type="button">Mi ubicación</button></div></label></div><div class="status" id="status">Cargando datos…</div></header><div class="mapwrap"><div id="map"></div><div class="badge" id="badge">ECMWF IFS</div><div class="legend" id="legend"><div class="legend-title" id="legendTitle">Escala</div><div class="legend-bar" id="legendBar"></div><div class="legend-scale"><span id="legendMin"></span><span id="legendMid"></span><span id="legendMax"></span></div><div class="legend-note" id="legendNote"></div></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(async function(){
 const map=L.map('map',{preferCanvas:true,scrollWheelZoom:false,zoomControl:true,minZoom:2}).setView([40,-3],4);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
 const defaultBounds=[[20,-25],[72,45]]; let overlay=null; let playing=false; let playTimer=null; let placeMarker=null; let placeText='';
 const q=id=>document.getElementById(id), status=q('status'), badge=q('badge');
 const pressureScale={925:[-15,40],850:[-20,35],700:[-30,25],500:[-45,15],300:[-65,-20],250:[-72,-25],200:[-75,-30]};
 const turbo='linear-gradient(90deg,#30123b 0%,#4145ab 12%,#2a7bde 25%,#1bb5a9 38%,#78d151 50%,#d8e219 62%,#fdae32 75%,#ef5a2f 88%,#7a0403 100%)';
 const viridis='linear-gradient(90deg,#440154 0%,#414487 25%,#2a788e 50%,#22a884 72%,#7ad151 88%,#fde725 100%)';
 const surfaceLegend={
   temperature_2m:{title:'Temperatura a 2 m',min:-30,max:45,unit:'°C',bar:turbo,note:'Escala cromática de temperatura ECMWF.'},
   wind_10m:{title:'Velocidad del viento a 10 m',min:0,max:140,unit:'km/h',bar:viridis,note:'Velocidad calculada con las componentes U/V oficiales.'},
   cloud_cover_total:{title:'Nubosidad total',min:0,max:100,unit:'%',bar:'linear-gradient(90deg,#ffffff 0%,#d7d7d7 35%,#8a8a8a 70%,#222222 100%)',note:'0 % cielo despejado · 100 % cubierto.'},
   precipitation_total:{title:'Precipitación total acumulada',min:0,max:60,unit:'mm',bar:'linear-gradient(90deg,#bfe9ff 0%,#2f9df4 18%,#19b66a 36%,#f7df36 55%,#f68b2c 72%,#d62626 88%,#7b1fa2 100%)',note:'Acumulada desde el inicio del pronóstico; no equivale solo a lluvia.'},
   snowfall_water_equivalent:{title:'Nieve · equivalente en agua',min:0,max:30,unit:'mm',bar:'linear-gradient(90deg,#e9f8ff 0%,#b9e8ff 22%,#76c8ff 42%,#5876e8 62%,#7f4cc9 80%,#c33ab8 100%)',note:'Equivalente en agua de la nevada; no es espesor de nieve en cm.'}
 };
 let surface,pressure,jets={};
 try{
   const loaded=await Promise.all([
     fetch('./manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('surface '+r.status);return r.json()}),
     fetch('./manifest-pressure-levels.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('pressure '+r.status);return r.json()}),
     fetch('./manifest-jet-300.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('jet300 '+r.status);return r.json()}),
     fetch('./manifest-jet-250.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('jet250 '+r.status);return r.json()}),
     fetch('./manifest-jet-200.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('jet200 '+r.status);return r.json()})
   ]);
   surface=loaded[0];pressure=loaded[1];jets={300:loaded[2],250:loaded[3],200:loaded[4]};
 } catch(e){status.textContent='No se pudieron cargar los manifiestos: '+e.message;return;}
 function currentJet(){return jets[parseInt(q('jetLevel').value,10)]||null;}
 function stepsForKind(){
   const kind=q('kind').value;
   if(kind==='surface')return Object.keys(surface.steps||{});
   if(kind==='jet')return Object.keys(currentJet()?.steps||{});
   const lev=q('level').value+'hpa';
   return Object.keys((pressure.levels&&pressure.levels[lev]&&pressure.levels[lev].steps)||{});
 }
 function stopPlay(){if(playTimer){clearInterval(playTimer);playTimer=null;}playing=false;q('playStep').textContent='▶ Reproducir';q('playStep').setAttribute('aria-label','Reproducir animación');q('playStep').title='Reproducir animación';}
 function updateTimelineState(){const n=q('step').options.length;const disabled=n<2;q('prevStep').disabled=disabled;q('nextStep').disabled=disabled;q('playStep').disabled=disabled;if(disabled)stopPlay();}
 function fillSteps(){const old=q('step').value;q('step').innerHTML='';stepsForKind().forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent='+'+parseInt(k.slice(1),10)+' h';q('step').appendChild(o)});if([...q('step').options].some(o=>o.value===old))q('step').value=old;updateTimelineState();}
 function selectedRecord(){const step=q('step').value;const kind=q('kind').value;if(kind==='surface')return surface.steps?.[step]?.[q('variable').value]||null;if(kind==='jet')return currentJet()?.steps?.[step]||null;const lev=q('level').value+'hpa';return pressure.levels?.[lev]?.steps?.[step]||null;}
 function titleFor(){const kind=q('kind').value;if(kind==='surface')return q('variable').selectedOptions[0]?.textContent||'Superficie';if(kind==='jet')return 'Jet Stream '+q('jetLevel').value+' hPa · viento + geopotencial';return q('level').value+' hPa · Temperatura + geopotencial';}
 function runFor(){const kind=q('kind').value;if(kind==='surface')return surface.run_utc||'';if(kind==='jet')return currentJet()?.run_utc||'';return pressure.run_utc||'';}
 function boundsFor(rec){if(rec&&rec.bounds&&Number.isFinite(rec.bounds.south)&&Number.isFinite(rec.bounds.west)&&Number.isFinite(rec.bounds.north)&&Number.isFinite(rec.bounds.east))return [[rec.bounds.south,rec.bounds.west],[rec.bounds.north,rec.bounds.east]];return defaultBounds;}
 function fmtLegend(v){return Number.isInteger(v)?String(v):v.toFixed(1)}
 function updateLegend(){
   const kind=q('kind').value;let cfg;
   if(kind==='surface')cfg=surfaceLegend[q('variable').value];
   else if(kind==='jet')cfg={title:'Jet Stream '+q('jetLevel').value+' hPa · velocidad del viento',min:60,max:360,unit:'km/h',bar:turbo,note:'Colores: velocidad del viento · líneas negras: altura geopotencial (m).'};
   else{const level=parseInt(q('level').value,10),range=pressureScale[level]||[-45,15];cfg={title:'Temperatura a '+level+' hPa',min:range[0],max:range[1],unit:'°C',bar:turbo,note:'Colores: temperatura · líneas negras: altura geopotencial (m).'};}
   const mid=(cfg.min+cfg.max)/2;q('legendTitle').textContent=cfg.title;q('legendBar').style.background=cfg.bar;q('legendMin').textContent=fmtLegend(cfg.min)+' '+cfg.unit;q('legendMid').textContent=fmtLegend(mid)+' '+cfg.unit;q('legendMax').textContent=fmtLegend(cfg.max)+' '+cfg.unit;q('legendNote').textContent=cfg.note;
 }
 function statusText(base){status.textContent=base+(placeText?' · ubicación: '+placeText:'');}
 function draw(){updateLegend();const rec=selectedRecord();if(overlay){map.removeLayer(overlay);overlay=null;}if(!rec){statusText('No hay datos para esta selección.');badge.textContent='ECMWF IFS · '+titleFor();return;}if(rec.status!=='ok'){statusText((rec.status==='not_applicable'?'No aplicable':'No disponible')+(rec.note?' · '+rec.note:''));badge.textContent='ECMWF IFS · '+titleFor();return;}overlay=L.imageOverlay('./'+rec.image,boundsFor(rec),{opacity:.74,interactive:false}).addTo(map);overlay.bringToFront();const run=runFor();statusText('Datos reales ECMWF Open Data · '+titleFor()+' · '+q('step').selectedOptions[0].textContent+(run?' · ejecución '+run:''));badge.textContent='ECMWF IFS · '+titleFor();}
 function moveStep(delta){const s=q('step');if(s.options.length<2)return;let i=s.selectedIndex+delta;if(i<0)i=s.options.length-1;if(i>=s.options.length)i=0;s.selectedIndex=i;draw();}
 function togglePlay(){if(playing){stopPlay();return;}if(q('step').options.length<2)return;playing=true;q('playStep').textContent='❚❚ Pausa';q('playStep').setAttribute('aria-label','Pausar animación');q('playStep').title='Pausar animación';playTimer=setInterval(()=>moveStep(1),1200);}
 function setPlace(lat,lon,label,zoom){if(!Number.isFinite(lat)||!Number.isFinite(lon))return;if(placeMarker)map.removeLayer(placeMarker);placeText=label||lat.toFixed(3)+', '+lon.toFixed(3);placeMarker=L.marker([lat,lon]).addTo(map).bindPopup(placeText);map.setView([lat,lon],zoom||8);placeMarker.openPopup();draw();setTimeout(()=>map.invalidateSize(),80);}
 async function searchPlace(){const text=q('place').value.trim();if(!text){statusText('Escribe una ciudad para buscar.');return;}const btn=q('searchPlace');btn.disabled=true;btn.textContent='Buscando…';try{const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&accept-language=es&q='+encodeURIComponent(text);const r=await fetch(url,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data)||!data.length){statusText('No se encontró esa ciudad.');return;}const item=data[0];setPlace(parseFloat(item.lat),parseFloat(item.lon),item.display_name||text,8);}catch(e){statusText('No se pudo buscar la ciudad: '+e.message);}finally{btn.disabled=false;btn.textContent='Buscar';}}
 function myLocation(){if(!navigator.geolocation){statusText('Este navegador no ofrece geolocalización.');return;}const btn=q('myLocation');btn.disabled=true;btn.textContent='Localizando…';navigator.geolocation.getCurrentPosition(pos=>{btn.disabled=false;btn.textContent='Mi ubicación';setPlace(pos.coords.latitude,pos.coords.longitude,'Mi ubicación',9);},err=>{btn.disabled=false;btn.textContent='Mi ubicación';const msg=err.code===1?'Permiso de ubicación denegado.':err.code===2?'No se pudo determinar la ubicación.':'La ubicación tardó demasiado.';statusText(msg);},{enableHighAccuracy:false,timeout:10000,maximumAge:300000});}
 function mode(){stopPlay();const kind=q('kind').value;q('varLabel').style.display=kind==='surface'?'flex':'none';q('levelLabel').style.display=kind==='pressure'?'flex':'none';q('jetLevelLabel').style.display=kind==='jet'?'flex':'none';fillSteps();draw();setTimeout(()=>map.invalidateSize(),100);}
 q('kind').addEventListener('change',mode);q('variable').addEventListener('change',draw);q('level').addEventListener('change',()=>{stopPlay();fillSteps();draw()});q('jetLevel').addEventListener('change',()=>{stopPlay();fillSteps();draw()});q('step').addEventListener('change',draw);q('prevStep').addEventListener('click',()=>{stopPlay();moveStep(-1)});q('nextStep').addEventListener('click',()=>{stopPlay();moveStep(1)});q('playStep').addEventListener('click',togglePlay);q('searchPlace').addEventListener('click',searchPlace);q('myLocation').addEventListener('click',myLocation);q('place').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchPlace();}});
 fillSteps();draw();map.fitBounds(defaultBounds,{padding:[6,6]});
})();
</script></body></html>
