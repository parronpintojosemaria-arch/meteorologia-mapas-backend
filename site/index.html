<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meteorología Interactiva · Modelos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#071528;color:#eef7ff;overflow:hidden}
*{box-sizing:border-box}.app{height:100%;display:flex;flex-direction:column;min-width:0}.top{padding:10px 12px;background:linear-gradient(135deg,#06294b,#0b4f84);box-shadow:0 2px 14px #0005;z-index:1001}.title{font-weight:800;font-size:16px}.sub{font-size:11px;opacity:.88;margin-top:2px}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.controls label{display:flex;flex-direction:column;gap:3px;font-size:10px;min-width:118px;flex:1}.controls select,.locationbox input{width:100%;min-width:0;border:1px solid #5fa8df;background:#fff;color:#10243a;border-radius:7px;padding:7px 8px;font-size:13px}.timeline{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:4px}.timeline button,.locationbox button{border:1px solid #5fa8df;background:#fff;color:#0a3558;border-radius:7px;padding:7px 6px;font-size:13px;font-weight:800;cursor:pointer;min-width:0}.timeline button:active,.locationbox button:active{transform:translateY(1px)}.timeline button[disabled],.locationbox button[disabled]{opacity:.45;cursor:default}.locationbox{display:grid;grid-template-columns:minmax(140px,1fr) auto;gap:4px}.locationbox button{white-space:nowrap}.status{margin-top:7px;font-size:11px;white-space:normal;overflow-wrap:anywhere}.mapwrap{position:relative;flex:1;min-height:0;min-width:0}#map{position:absolute;inset:0}.badge{position:absolute;z-index:900;left:9px;bottom:9px;max-width:calc(100% - 18px);background:rgba(5,20,37,.88);border:1px solid rgba(255,255,255,.2);color:#fff;padding:7px 9px;border-radius:8px;font-size:11px;line-height:1.35;pointer-events:none}.legend{position:absolute;z-index:900;right:9px;bottom:9px;width:min(300px,calc(100% - 18px));background:rgba(5,20,37,.90);border:1px solid rgba(255,255,255,.22);color:#fff;padding:8px 9px;border-radius:8px;font-size:10px;line-height:1.3;pointer-events:none}.legend-title{font-weight:800;margin-bottom:5px}.legend-bar{height:12px;border-radius:5px;border:1px solid rgba(255,255,255,.45);overflow:hidden}.legend-scale{display:flex;justify-content:space-between;gap:5px;margin-top:3px;font-variant-numeric:tabular-nums}.legend-note{margin-top:4px;opacity:.88}.leaflet-control-attribution{font-size:9px!important}
@media(max-width:700px){.top{padding:8px}.title{font-size:14px}.controls{display:grid;grid-template-columns:1fr 1fr}.controls label{min-width:0}.status{font-size:10px}.legend{right:7px;bottom:7px;width:min(250px,calc(100% - 14px));font-size:9px}.badge{left:7px;bottom:7px;max-width:calc(100% - 14px)}}
@media(max-width:520px){.badge{bottom:92px;max-width:calc(100% - 14px)}.legend{width:calc(100% - 14px)}}
@media(max-width:420px){.controls{grid-template-columns:1fr}.controls select,.timeline button,.locationbox input,.locationbox button{font-size:12px;padding:6px 7px}.locationbox{grid-template-columns:1fr auto}.top{max-height:54vh;overflow:auto}.badge{font-size:10px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="title">Meteorología Interactiva · Modelos</div>
  <div class="sub">ECMWF IFS hasta 15 días · NOAA GFS hasta 16 días · datos oficiales · Leaflet ligero · sin WebGL</div>
  <div class="controls">
    <label>Modelo
      <select id="model"><option value="ecmwf">ECMWF IFS</option><option value="gfs">NOAA GFS</option></select>
    </label>
    <label>Tipo
      <select id="kind"><option value="surface">Superficie</option><option value="pressure">Niveles de presión</option><option value="jet">Jet Stream</option></select>
    </label>
    <label id="varLabel">Variable<select id="variable"></select></label>
    <label id="levelLabel" style="display:none">Nivel
      <select id="level"><option>925</option><option>850</option><option>700</option><option>500</option><option>300</option><option>250</option><option>200</option></select>
    </label>
    <label id="jetLevelLabel" style="display:none">Nivel Jet
      <select id="jetLevel"><option>300</option><option selected>250</option><option>200</option></select>
    </label>
    <label>Pronóstico<select id="step"></select></label>
    <label>Animación
      <div class="timeline">
        <button id="prevStep" type="button" title="Paso anterior" aria-label="Paso anterior">◀</button>
        <button id="playStep" type="button" title="Reproducir animación" aria-label="Reproducir animación">▶ Reproducir</button>
        <button id="nextStep" type="button" title="Paso siguiente" aria-label="Paso siguiente">▶</button>
      </div>
    </label>
    <label>Buscar ciudad
      <div class="locationbox"><input id="place" type="search" inputmode="search" autocomplete="off" placeholder="Ciudad…" aria-label="Buscar ciudad"><button id="searchPlace" type="button">Buscar</button></div>
    </label>
  </div>
  <div class="status" id="status">Cargando datos…</div>
</header>
<div class="mapwrap">
  <div id="map"></div>
  <div class="badge" id="badge">Modelos</div>
  <div class="legend" id="legend">
    <div class="legend-title" id="legendTitle">Escala</div>
    <div class="legend-bar" id="legendBar"></div>
    <div class="legend-scale"><span id="legendMin"></span><span id="legendMid"></span><span id="legendMax"></span></div>
    <div class="legend-note" id="legendNote"></div>
  </div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(async function(){
  const q=id=>document.getElementById(id);
  const status=q('status'),badge=q('badge');
  const map=L.map('map',{preferCanvas:true,scrollWheelZoom:false,zoomControl:true,minZoom:2}).setView([40,-3],4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
  const defaultBounds=[[20,-25],[72,45]];
  let overlay=null,playing=false,playTimer=null,placeMarker=null,placeText='';

  const pressureScale={925:[-15,40],850:[-20,35],700:[-30,25],500:[-45,15],300:[-65,-20],250:[-72,-25],200:[-75,-30]};
  const turbo='linear-gradient(90deg,#30123b 0%,#4145ab 12%,#2a7bde 25%,#1bb5a9 38%,#78d151 50%,#d8e219 62%,#fdae32 75%,#ef5a2f 88%,#7a0403 100%)';
  const viridis='linear-gradient(90deg,#440154 0%,#414487 25%,#2a788e 50%,#22a884 72%,#7ad151 88%,#fde725 100%)';
  const clouds='linear-gradient(90deg,#ffffff 0%,#d7d7d7 35%,#8a8a8a 70%,#222222 100%)';
  const precip='linear-gradient(90deg,#bfe9ff 0%,#2f9df4 18%,#19b66a 36%,#f7df36 55%,#f68b2c 72%,#d62626 88%,#7b1fa2 100%)';
  const snowWe='linear-gradient(90deg,#e9f8ff 0%,#b9e8ff 22%,#76c8ff 42%,#5876e8 62%,#7f4cc9 80%,#c33ab8 100%)';
  const snowDepth='linear-gradient(90deg,#f7fbff 0%,#d0e8f2 25%,#73b3d8 50%,#2878b5 72%,#08306b 100%)';

  const modelInfo={
    ecmwf:{name:'ECMWF IFS',source:'ECMWF Open Data',horizon:'15 días'},
    gfs:{name:'NOAA GFS',source:'NOAA/NCEP NOMADS',horizon:'16 días'}
  };
  const variableOptions={
    ecmwf:[
      ['temperature_2m','Temperatura 2 m'],['wind_10m','Viento 10 m'],['cloud_cover_total','Nubosidad total'],
      ['precipitation_total','Precipitación total acumulada'],['snowfall_water_equivalent','Nieve caída · equivalente en agua']
    ],
    gfs:[
      ['temperature_2m','Temperatura 2 m'],['wind_10m','Viento 10 m'],['cloud_cover_total','Nubosidad total'],
      ['precipitation_total','Precipitación total acumulada'],['snow_depth','Espesor de nieve en el suelo']
    ]
  };

  async function getJson(path,label){
    const r=await fetch(path,{cache:'no-store'});
    if(!r.ok)throw Error(label+' '+r.status);
    return r.json();
  }

  const data={};
  try{
    const loaded=await Promise.all([
      getJson('./ecmwf/manifest-phase29-ecmwf.json','ECMWF'),
      getJson('./gfs/manifest-phase29-gfs.json','GFS')
    ]);
    data.ecmwf=loaded[0]; data.gfs=loaded[1];
    if(data.ecmwf.status!=='ok'||data.gfs.status!=='ok')throw Error('algún manifiesto no está completo');
  }catch(e){status.textContent='No se pudieron cargar los mapas: '+e.message;return;}

  function modelKey(){return q('model').value;}
  function manifest(){return data[modelKey()];}
  function info(){return modelInfo[modelKey()];}
  function stepKey(h){return 'f'+String(h).padStart(3,'0');}
  function stepHours(key){return parseInt(String(key).replace(/^f/,''),10);}
  function formatStep(h){
    if(h===0)return '+0 h · inicio';
    if(h%24===0)return '+'+h+' h · día '+(h/24);
    return '+'+h+' h';
  }
  function runDate(){
    const d=new Date(manifest().run_utc);
    return isNaN(d)?'':d.toLocaleString('es-ES',{timeZone:'UTC',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' UTC';
  }
  function validDate(h){
    const d=new Date(manifest().run_utc);
    if(isNaN(d))return '';
    d.setTime(d.getTime()+h*3600000);
    return d.toLocaleString('es-ES',{timeZone:'UTC',weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' UTC';
  }
  function rebuildVariables(){
    const old=q('variable').value;
    q('variable').innerHTML='';
    variableOptions[modelKey()].forEach(pair=>{
      const o=document.createElement('option');o.value=pair[0];o.textContent=pair[1];q('variable').appendChild(o);
    });
    if(Array.from(q('variable').options).some(o=>o.value===old))q('variable').value=old;
  }
  function recordFor(key){
    const m=manifest(),kind=q('kind').value;
    if(kind==='surface')return m.surface&&m.surface[key]?m.surface[key][q('variable').value]:null;
    if(kind==='pressure')return m.pressure&&m.pressure[q('level').value+'hpa']?m.pressure[q('level').value+'hpa'][key]:null;
    return m.jet&&m.jet[q('jetLevel').value+'hpa']?m.jet[q('jetLevel').value+'hpa'][key]:null;
  }
  function availableSteps(){
    const m=manifest(),kind=q('kind').value;
    const raw=(kind==='surface'?m.surface_steps:m.aloft_steps)||[];
    return raw.map(Number).filter(h=>{const r=recordFor(stepKey(h));return r&&r.status==='ok';});
  }
  function rebuildSteps(prefer){
    const steps=availableSteps(),sel=q('step');
    let want=Number.isFinite(prefer)?prefer:stepHours(sel.value||'f000');
    if(!steps.includes(want))want=steps.length?steps.reduce((a,b)=>Math.abs(b-want)<Math.abs(a-want)?b:a,steps[0]):0;
    sel.innerHTML='';
    steps.forEach(h=>{const o=document.createElement('option');o.value=stepKey(h);o.textContent=formatStep(h);sel.appendChild(o);});
    if(steps.length)sel.value=stepKey(want);
    q('prevStep').disabled=steps.length<2;q('nextStep').disabled=steps.length<2;q('playStep').disabled=steps.length<2;
  }
  function titleFor(){
    const kind=q('kind').value;
    if(kind==='surface')return q('variable').selectedOptions[0]?q('variable').selectedOptions[0].textContent:'Superficie';
    if(kind==='pressure')return q('level').value+' hPa · Temperatura + geopotencial';
    return 'Jet Stream '+q('jetLevel').value+' hPa · viento + geopotencial';
  }
  function boundsFor(rec){
    if(rec&&rec.bounds&&Number.isFinite(rec.bounds.south)&&Number.isFinite(rec.bounds.west)&&Number.isFinite(rec.bounds.north)&&Number.isFinite(rec.bounds.east))return [[rec.bounds.south,rec.bounds.west],[rec.bounds.north,rec.bounds.east]];
    return defaultBounds;
  }
  function rangeText(rec){
    const r=rec&&rec.range;if(!r||!Number.isFinite(r.min)||!Number.isFinite(r.max))return '';
    return ' · rango '+r.min+'–'+r.max+(rec.units?' '+rec.units:'');
  }
  function updateLegend(rec){
    const kind=q('kind').value,variable=q('variable').value;
    let title='',bar=turbo,min='',mid='',max='',note='';
    if(kind==='surface'){
      if(variable==='temperature_2m'){title='Temperatura a 2 m';bar=turbo;min='-30 °C';mid='7 °C';max='45 °C';note='Temperatura del aire a 2 m.';}
      else if(variable==='wind_10m'){title='Velocidad del viento a 10 m';bar=viridis;min='0';mid='70';max='140 km/h';note='Velocidad derivada de los componentes U/V.';}
      else if(variable==='cloud_cover_total'){title='Nubosidad total';bar=clouds;min='0 %';mid='50 %';max='100 %';note='Fracción total de cielo cubierto.';}
      else if(variable==='precipitation_total'){title='Precipitación total acumulada';bar=precip;min='0';mid='60';max='120 mm';note='Acumulada desde el inicio de la ejecución; incluye precipitación líquida y sólida.';}
      else if(variable==='snowfall_water_equivalent'){title='Nieve caída · equivalente en agua';bar=snowWe;min='0';mid='30';max='60 mm';note='ECMWF: agua equivalente de la nevada acumulada; no es espesor en cm.';}
      else {title='Espesor de nieve en el suelo';bar=snowDepth;min='0';mid='50';max='100 cm';note='GFS: espesor instantáneo de nieve presente en el suelo; no es nieve caída acumulada.';}
      note+=rangeText(rec);
    }else if(kind==='pressure'){
      const sc=pressureScale[parseInt(q('level').value,10)]||[-45,15];
      title=q('level').value+' hPa · temperatura y altura geopotencial';bar=turbo;min=sc[0]+' °C';mid=Math.round((sc[0]+sc[1])/2)+' °C';max=sc[1]+' °C';note='Color: temperatura. Líneas negras: altura geopotencial en metros.';
    }else{
      title='Jet Stream '+q('jetLevel').value+' hPa';bar=turbo;min='60';mid='210';max='360 km/h';note='Color: velocidad del viento en altura. Líneas negras: altura geopotencial.';
    }
    q('legendTitle').textContent=title;q('legendBar').style.background=bar;q('legendMin').textContent=min;q('legendMid').textContent=mid;q('legendMax').textContent=max;q('legendNote').textContent=note;
  }
  function render(){
    const key=q('step').value,rec=recordFor(key),h=stepHours(key);
    if(overlay){map.removeLayer(overlay);overlay=null;}
    if(!rec||rec.status!=='ok'||!rec.image){status.textContent='No hay mapa disponible para esta combinación.';return;}
    overlay=L.imageOverlay('./'+rec.image,boundsFor(rec),{opacity:.82,interactive:false}).addTo(map);
    const place=placeText?' · ciudad: '+placeText:'';
    const valid=validDate(h);
    badge.textContent=info().name+' · '+titleFor()+' · '+formatStep(h)+(valid?' · válido '+valid:'');
    status.textContent=info().source+' · ejecución '+runDate()+' · horizonte '+info().horizon+' · '+manifest().strategy+place;
    updateLegend(rec);
  }
  function updateKind(){
    const kind=q('kind').value;
    q('varLabel').style.display=kind==='surface'?'flex':'none';
    q('levelLabel').style.display=kind==='pressure'?'flex':'none';
    q('jetLevelLabel').style.display=kind==='jet'?'flex':'none';
    stopAnimation();rebuildSteps();render();
  }
  function stopAnimation(){
    playing=false;if(playTimer){clearInterval(playTimer);playTimer=null;}q('playStep').textContent='▶ Reproducir';
  }
  function moveStep(delta){
    const steps=availableSteps();if(steps.length<2)return;
    let i=steps.indexOf(stepHours(q('step').value));if(i<0)i=0;i=(i+delta+steps.length)%steps.length;q('step').value=stepKey(steps[i]);render();
  }
  function togglePlay(){
    if(playing){stopAnimation();return;}
    if(availableSteps().length<2)return;
    playing=true;q('playStep').textContent='⏸ Pausar';playTimer=setInterval(()=>moveStep(1),1200);
  }
  async function searchPlace(){
    const text=q('place').value.trim();if(!text)return;
    const btn=q('searchPlace');btn.disabled=true;status.textContent='Buscando '+text+'…';
    try{
      const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&accept-language=es&q='+encodeURIComponent(text);
      const r=await fetch(u,{headers:{'Accept':'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);
      const results=await r.json();if(!results.length)throw Error('no encontrada');
      const lat=parseFloat(results[0].lat),lon=parseFloat(results[0].lon);if(!Number.isFinite(lat)||!Number.isFinite(lon))throw Error('coordenadas no válidas');
      placeText=results[0].display_name||text;if(placeMarker)map.removeLayer(placeMarker);placeMarker=L.marker([lat,lon]).addTo(map).bindPopup(placeText);map.setView([lat,lon],8);render();
    }catch(e){status.textContent='No se pudo localizar la ciudad: '+e.message;}finally{btn.disabled=false;}
  }

  q('model').addEventListener('change',()=>{stopAnimation();const h=stepHours(q('step').value);rebuildVariables();rebuildSteps(h);render();});
  q('kind').addEventListener('change',updateKind);
  q('variable').addEventListener('change',()=>{stopAnimation();rebuildSteps(stepHours(q('step').value));render();});
  q('level').addEventListener('change',()=>{stopAnimation();rebuildSteps(stepHours(q('step').value));render();});
  q('jetLevel').addEventListener('change',()=>{stopAnimation();rebuildSteps(stepHours(q('step').value));render();});
  q('step').addEventListener('change',render);
  q('prevStep').addEventListener('click',()=>moveStep(-1));q('nextStep').addEventListener('click',()=>moveStep(1));q('playStep').addEventListener('click',togglePlay);
  q('searchPlace').addEventListener('click',searchPlace);q('place').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchPlace();}});

  rebuildVariables();rebuildSteps(0);updateKind();map.fitBounds(defaultBounds,{padding:[4,4]});
})();
</script>
</body>
</html>
