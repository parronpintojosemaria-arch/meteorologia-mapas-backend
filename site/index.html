<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Meteorología Interactiva · Modelos</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#071528;color:#eef7ff;overflow:hidden}*{box-sizing:border-box}.app{height:100%;display:flex;flex-direction:column}.top{padding:9px 11px;background:linear-gradient(135deg,#06294b,#0b4f84);z-index:1001}.title{font-weight:800}.sub,.status{font-size:11px;opacity:.9;margin-top:3px}.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.controls label{display:flex;flex-direction:column;gap:3px;font-size:10px;min-width:110px;flex:1}.controls select,.search input{width:100%;border:1px solid #5fa8df;background:#fff;color:#10243a;border-radius:7px;padding:7px;font-size:12px}.buttons,.search{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:4px}.search{grid-template-columns:1fr auto}.buttons button,.search button{border:1px solid #5fa8df;background:#fff;color:#0a3558;border-radius:7px;padding:7px;font-weight:800;cursor:pointer}.mapwrap{position:relative;flex:1;min-height:0}#map{position:absolute;inset:0}.badge,.legend{position:absolute;z-index:900;bottom:9px;background:#051425e8;border:1px solid #ffffff33;padding:7px 9px;border-radius:8px;font-size:10px;line-height:1.35;pointer-events:none}.badge{left:9px;max-width:60%}.legend{right:9px;max-width:38%}.bar{height:10px;border-radius:4px;margin:4px 0;background:linear-gradient(90deg,#2f9df4,#19b66a,#f7df36,#d62626,#7b1fa2)}.credits{display:none}@media(max-width:650px){.top{max-height:50vh;overflow:auto;padding-top:max(9px,env(safe-area-inset-top))}.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.controls label{min-width:0}.controls select,.search input,.buttons button,.search button{font-size:11px}.mapwrap{display:grid;grid-template-rows:minmax(220px,1fr) auto auto auto;overflow:auto;background:#071528}#map{position:relative;inset:auto;width:100%;height:100%;min-height:220px}.badge,.legend,.credits{position:static;left:auto;right:auto;bottom:auto;max-width:none;margin:7px 8px 0;border-radius:8px}.badge{font-size:10px}.legend{font-size:10px}.credits{display:block;background:#051425e8;border:1px solid #ffffff33;padding:7px 9px;font-size:10px;line-height:1.35;color:#eef7ff;margin-bottom:max(8px,env(safe-area-inset-bottom));overflow-wrap:anywhere}}@media(max-width:330px){.controls{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><div class="title">Meteorología Interactiva · Modelos</div><div class="sub">ECMWF IFS · NOAA GFS · DWD ICON-EU · superficie, niveles de presión, Jet y precipitación</div><div class="controls"><label>Modelo<select id="model"><option value="ecmwf">ECMWF IFS</option><option value="gfs">NOAA GFS</option><option value="icon-eu">DWD ICON-EU</option></select></label><label>Tipo<select id="kind"><option value="surface">Superficie</option><option value="pressure">Niveles de presión</option><option value="jet">Jet Stream</option></select></label><label id="varLabel">Variable<select id="variable"></select></label><label id="levelLabel" style="display:none">Nivel<select id="level"><option>925</option><option>850</option><option>700</option><option>500</option><option>300</option><option>250</option><option>200</option></select></label><label id="jetLabel" style="display:none">Nivel Jet<select id="jet"><option>300</option><option selected>250</option><option>200</option></select></label><label>Pronóstico<select id="step"></select></label><label>Animación<div class="buttons"><button id="prev">◀</button><button id="play">▶ Reproducir</button><button id="next">▶</button></div></label><label>Buscar ciudad<div class="search"><input id="place" type="search" placeholder="Ciudad…"><button id="search">Buscar</button></div></label></div><div class="status" id="status">Cargando datos…</div></header><div class="mapwrap"><div id="map"></div><div class="badge" id="badge">Modelos</div><div class="legend"><b id="legendTitle">Escala</b><div class="bar"></div><div id="legendText"></div></div><div class="credits" id="credits"></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),status=$('status'),badge=$('badge'),credits=$('credits');const map=L.map('map',{preferCanvas:true,scrollWheelZoom:false,minZoom:2}).setView([40,-3],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const defaultBounds=[[20,-25],[72,45]],iconBounds={south:29.46875,west:-23.53125,north:70.53125,east:45.03125};let overlay=null,timer=null,marker=null,placeText='';
const info={ecmwf:{name:'ECMWF IFS',source:'ECMWF Open Data',horizon:'15 días'},gfs:{name:'NOAA GFS',source:'NOAA/NCEP NOMADS',horizon:'16 días'},'icon-eu':{name:'DWD ICON-EU',source:'DWD Open Data',horizon:'5 días'}};const vars={ecmwf:[['temperature_2m','Temperatura 2 m'],['wind_10m','Viento 10 m'],['cloud_cover_total','Nubosidad total'],['precipitation_rate','Intensidad de precipitación'],['precipitation_type','Tipo de precipitación'],['precipitation_total','Precipitación total acumulada'],['snowfall_water_equivalent','Nieve caída · equivalente en agua']],gfs:[['temperature_2m','Temperatura 2 m'],['wind_10m','Viento 10 m'],['cloud_cover_total','Nubosidad total'],['precipitation_rate','Intensidad de precipitación'],['precipitation_type','Tipo de precipitación'],['precipitation_total','Precipitación total acumulada'],['snow_depth','Espesor de nieve en el suelo']],'icon-eu':[['temperature_2m','Temperatura 2 m'],['wind_10m','Viento 10 m'],['cloud_cover_total','Nubosidad total'],['rain_interval_intensity','Lluvia del intervalo · intensidad media'],['precipitation_total','Precipitación total acumulada'],['rain_accumulation','Lluvia acumulada'],['snowfall_water_equivalent','Nieve acumulada · equivalente en agua']]};
async function json(path,label){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error(label+' '+r.status);return r.json()}const data={ecmwf:{},gfs:{},'icon-eu':{}};try{const x=await Promise.all([json('./ecmwf/manifest-phase29-ecmwf.json','ECMWF'),json('./gfs/manifest-phase29-gfs.json','GFS'),json('./ecmwf/manifest-phase30-ecmwf.json','ECMWF precipitación'),json('./gfs/manifest-phase30-gfs.json','GFS precipitación'),json('./icon-eu/latest.json','ICON-EU')]);data.ecmwf={main:x[0],precip:x[2]};data.gfs={main:x[1],precip:x[3]};data['icon-eu'].main=x[4];data['icon-eu'].precip=await json('./icon-eu/'+x[4].base_path+'/manifest-rain-interval.json','ICON-EU lluvia');for(const m of ['ecmwf','gfs']){if(data[m].main.status!=='ok'||data[m].precip.status!=='ok'||data[m].main.run_utc!==data[m].precip.run_utc)throw Error(m+' incompleto o mezcla pasadas')}if(x[4].status!=='ok'||x[4].forecast_steps.length!==93||data['icon-eu'].precip.status!=='ok'||data['icon-eu'].precip.run_utc!==x[4].run_utc||data['icon-eu'].precip.forecast_steps.length!==92)throw Error('ICON-EU incompleto o mezcla pasadas')}catch(e){status.textContent='No se pudieron cargar los mapas: '+e.message;return}
const model=()=> $('model').value,main=()=>data[model()].main,prec=()=>data[model()].precip,isIcon=()=>model()==='icon-eu',key=h=>'f'+String(h).padStart(3,'0'),hour=k=>parseInt(String(k).replace(/^f/,''),10),extra=v=>v==='precipitation_rate'||v==='precipitation_type';function date(h=0){const d=new Date(main().run_utc);d.setTime(d.getTime()+h*3600000);return d.toLocaleString('es-ES',{timeZone:'UTC',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' UTC'}function rec(k){const kind=$('kind').value,v=$('variable').value,m=main();if(isIcon()){const base='icon-eu/'+m.base_path+'/';if(kind==='surface'&&v==='rain_interval_intensity'){const r=prec().steps?.[k];return r?{...r,image:base+v+'/'+k+'.webp',bounds:r.bounds||iconBounds}:null}if(kind==='surface')return{status:'ok',image:base+v+'/'+k+'.webp',bounds:iconBounds};if(kind==='pressure')return{status:'ok',image:base+'pressure/'+$('level').value+'hpa_temperature_geopotential/'+k+'.webp',bounds:iconBounds};return{status:'ok',image:base+'jet/jet_stream_'+$('jet').value+'hpa/'+k+'.webp',bounds:iconBounds}}if(kind==='surface'){if(extra(v))return prec().steps?.[k]?.[v]||null;return m.surface?.[k]?.[v]||null}if(kind==='pressure')return m.pressure?.[$('level').value+'hpa']?.[k]||null;return m.jet?.[$('jet').value+'hpa']?.[k]||null}
function steps(){const kind=$('kind').value,v=$('variable').value,m=main();let a;if(isIcon())a=v==='rain_interval_intensity'?prec().forecast_steps:m.forecast_steps;else if(kind==='surface'&&extra(v))a=Object.keys(prec().steps||{}).map(hour);else a=(kind==='surface'?m.surface_steps:m.aloft_steps)||[];return a.map(Number).filter(h=>rec(key(h))?.status==='ok')}function format(h){return h===0?'+0 h · inicio':h%24===0?'+'+h+' h · día '+h/24:'+'+h+' h'}function rebuildVars(){const old=$('variable').value;$('variable').innerHTML='';for(const [v,n] of vars[model()]){const o=document.createElement('option');o.value=v;o.textContent=n;$('variable').appendChild(o)}if([...$('variable').options].some(o=>o.value===old))$('variable').value=old}function rebuildSteps(prefer){const a=steps(),s=$('step');let want=Number.isFinite(prefer)?prefer:hour(s.value||'f000');if(!a.includes(want)&&a.length)want=a.reduce((x,y)=>Math.abs(y-want)<Math.abs(x-want)?y:x,a[0]);s.innerHTML='';for(const h of a){const o=document.createElement('option');o.value=key(h);o.textContent=format(h);s.appendChild(o)}if(a.length)s.value=key(want)}function bounds(r){return r?.bounds?[[r.bounds.south,r.bounds.west],[r.bounds.north,r.bounds.east]]:defaultBounds}function title(){const k=$('kind').value;if(k==='surface')return $('variable').selectedOptions[0]?.textContent||'Superficie';if(k==='pressure')return $('level').value+' hPa · temperatura + geopotencial';return 'Jet Stream '+$('jet').value+' hPa'}function legend(){const v=$('variable').value,k=$('kind').value;let t=title(),x='';if(k==='surface'){if(v==='temperature_2m')x='Temperatura del aire a 2 m.';else if(v==='wind_10m')x='Velocidad del viento a 10 m.';else if(v==='cloud_cover_total')x='Nubosidad total.';else if(v==='rain_interval_intensity')x='ICON-EU: intensidad media de la lluvia del intervalo; +1…+78 h son intervalos de 1 h y +81…+120 h de 3 h. No es acumulado.';else if(v==='precipitation_rate')x='Tasa instantánea de precipitación en mm/h; no es acumulado.';else if(v==='precipitation_type')x='Tipo de precipitación calculado por el modelo.';else if(v==='rain_accumulation')x='ICON-EU: lluvia acumulada desde el inicio, separada de la nieve.';else if(v==='snowfall_water_equivalent')x='Nieve acumulada expresada como equivalente en agua; no es espesor en cm.';else if(v==='snow_depth')x='Espesor instantáneo de nieve en el suelo.';else x='Precipitación total acumulada desde el inicio.'}else if(k==='pressure')x='Color: temperatura. Líneas: altura geopotencial.';else x='Viento en altura y geopotencial.';$('legendTitle').textContent=t;$('legendText').textContent=x}
function render(){const k=$('step').value,r=rec(k),h=hour(k);if(overlay){map.removeLayer(overlay);overlay=null}if(!r?.image){status.textContent='No hay mapa disponible para esta combinación.';return}overlay=L.imageOverlay('./'+r.image,bounds(r),{opacity:.82,interactive:false}).addTo(map);badge.textContent=info[model()].name+' · '+title()+' · '+format(h)+' · válido '+date(h);const cadence=main().strategy||main().step_rule||'';status.textContent=info[model()].source+' · ejecución '+date(0)+' · horizonte '+info[model()].horizon+(cadence?' · '+cadence:'')+(placeText?' · ciudad: '+placeText:'');credits.textContent='Creado por José María Parrón Pinto (elrincondeteexplicoTube) · Datos oficiales: '+info[model()].source;legend()}function updateKind(){const k=$('kind').value;$('varLabel').style.display=k==='surface'?'flex':'none';$('levelLabel').style.display=k==='pressure'?'flex':'none';$('jetLabel').style.display=k==='jet'?'flex':'none';stop();rebuildSteps();render()}function move(d){const a=steps();if(a.length<2)return;let i=a.indexOf(hour($('step').value));$('step').value=key(a[(i+d+a.length)%a.length]);render()}function stop(){if(timer){clearInterval(timer);timer=null}$('play').textContent='▶ Reproducir'}function play(){if(timer){stop();return}timer=setInterval(()=>move(1),1200);$('play').textContent='⏸ Pausar'}async function search(){const text=$('place').value.trim();if(!text)return;status.textContent='Buscando '+text+'…';try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=es&q='+encodeURIComponent(text));const a=await r.json();if(!a.length)throw Error('no encontrada');const lat=+a[0].lat,lon=+a[0].lon;placeText=a[0].display_name||text;if(marker)map.removeLayer(marker);marker=L.marker([lat,lon]).addTo(map).bindPopup(placeText);map.setView([lat,lon],8);render()}catch(e){status.textContent='No se pudo localizar la ciudad: '+e.message}}
$('model').onchange=()=>{stop();const h=hour($('step').value);rebuildVars();rebuildSteps(h);render()};$('kind').onchange=updateKind;$('variable').onchange=()=>{stop();rebuildSteps(hour($('step').value));render()};$('level').onchange=$('jet').onchange=()=>{stop();rebuildSteps(hour($('step').value));render()};$('step').onchange=render;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('play').onclick=play;$('search').onclick=search;$('place').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};rebuildVars();rebuildSteps(0);updateKind();map.fitBounds(defaultBounds,{padding:[4,4]});window.addEventListener('resize',()=>setTimeout(()=>map.invalidateSize({pan:false}),80))})();
</script></body></html>
